version: '3.8'

services:
  netcap-try:
    build:
      context: ../..
      dockerfile: docker/try/Dockerfile
    container_name: netcap-try
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - netcap-try-data:/data
    environment:
      - NC_DATA_DIR=/data/netcap-try
      - NC_HTTP=0.0.0.0:7070
      - NC_DPI=true
      - NC_MAX_FILE_SIZE=52428800        # 50MB in bytes
      - NC_MAX_ANALYSIS_HOUR=2           # Max 2 analyses per hour per IP
      - NC_SESSION_EXPIRY=60             # Session expiry in minutes
      - NC_CLEANUP_INTERVAL=10           # Cleanup interval in minutes
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - netcap-try
    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  netcap-try-data:
    driver: local

networks:
  netcap-try:
    driver: bridge

