# Suspicious HTTP User Agents Detection Rules
# Based on: https://raw.githubusercontent.com/mthcht/awesome-lists/refs/heads/main/Lists/suspicious_http_user_agents_list.csv
# These rules detect suspicious, malicious, and potentially unwanted HTTP user agents

description: "Detection rules for suspicious HTTP user agents including malware C2 communication, offensive security tools, phishing frameworks, stealers, RMM tools, exploitation frameworks, and other potentially malicious software."

rules:
  # ========================================
  # CREDENTIAL ACCESS & DISCOVERY TOOLS
  # ========================================

  - name: Certipy User Agent Detected
    description: Default user agent for nltm lib of certipy - Active Directory certificate abuse tool
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)certipy")
    severity: high
    mitre: ["T1649", "T1552"]
    tags: ["credential-access", "discovery", "certipy"]
    enabled: true

  - name: TruffleHog User Agent Detected
    description: Find verify and analyze leaked credentials open source github project
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)trufflehog")
    severity: high
    mitre: ["T1552"]
    tags: ["credential-access", "trufflehog"]
    enabled: true

  - name: AzureHound User Agent Detected
    description: Azure Data Exporter for BloodHound - default user agent
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)azurehound")
    severity: critical
    mitre: ["T1087", "T1069"]
    tags: ["discovery", "azurehound", "bloodhound"]
    enabled: true

  # ========================================
  # MALWARE & STEALER USER AGENTS
  # ========================================

  - name: DarkCloud Malware User Agent Detected
    description: User agent used by DarkCloud malware
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)(project1sqlite|project1)")
    severity: high
    mitre: ["T1071"]
    tags: ["malware", "darkcloud", "c2"]
    enabled: true

  - name: Lokibot Malware User Agent Detected
    description: User agent used by Lokibot malware containing Charon Inferno
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)(charon|inferno)")
    severity: high
    mitre: ["T1071", "T1003"]
    tags: ["malware", "lokibot", "stealer"]
    enabled: true

  - name: Arkei Stealer User Agent Detected
    description: User agent used by Arkei Stealer malware
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)arkei")
    severity: high
    mitre: ["T1071", "T1555"]
    tags: ["malware", "stealer", "arkei"]
    enabled: true

  - name: Katz Stealer User Agent Detected
    description: User agent used by Katz Stealer credential theft malware
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)katz-ontop")
    severity: high
    mitre: ["T1071", "T1555", "T1003"]
    tags: ["malware", "stealer", "katz"]
    enabled: true

  - name: Matanbuchus Malware User Agent Detected
    description: Matanbuchus 3.0 using specific user agent mimicking Skype communication
    type: HTTP
    expression: UserAgent == "Skype/8.69.0.77 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
    severity: high
    mitre: ["T1071"]
    tags: ["malware", "matanbuchus", "ransomware"]
    enabled: true

  - name: DarkRAT Bot Checkin User Agent Detected
    description: Bot check-in request for DarkRAT malware
    type: HTTP
    expression: UserAgent == "SUq1rx"
    severity: critical
    mitre: ["T1071"]
    tags: ["malware", "darkrat", "c2", "rat"]
    enabled: true

  # ========================================
  # PHISHING & CREDENTIAL HARVESTING
  # ========================================

  - name: Undici Phishing Framework User Agent Detected
    description: HTTP/1.1 client written from scratch for Node.js often seen used in phishing as a service
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)undici")
    severity: medium
    mitre: ["T1566"]
    tags: ["phishing", "undici"]
    enabled: true

  - name: TeamFiltration Tool User Agent Detected
    description: Microsoft Teams credential theft and exfiltration tool
    type: HTTP
    expression: UserAgent == "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Teams/1.3.00.30866 Chrome/80.0.3987.165 Electron/8.5.1 Safari/537.36"
    severity: medium
    mitre: ["T1087", "T1114"]
    tags: ["phishing", "teamfiltration", "o365"]
    enabled: true

  - name: DeviceCodePhishing User Agent Detected
    description: Used by default on a Device Code Phishing project
    type: HTTP
    expression: UserAgent == "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36 Edq/135.0.0.0"
    severity: critical
    mitre: ["T1528", "T1566"]
    tags: ["phishing", "device-code", "oauth"]
    enabled: true

  - name: Raccoon O365 Phishing Framework User Agent Detected
    description: Phishing as a service package Raccoon0365
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)intel raccoon o365")
    severity: critical
    mitre: ["T1566", "T1110"]
    tags: ["phishing", "raccoon", "o365", "2fa-bypass"]
    enabled: true

  - name: Axios HTTP Client Suspicious User Agent Detected
    description: Lightweight HTTP client library for JavaScript - attackers observed bypassing MFA in O365 using axios HTTP client
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)^axios")
    severity: medium
    mitre: ["T1110"]
    tags: ["phishing", "axios", "mfa-bypass"]
    enabled: true

  - name: Aiohttp Suspicious User Agent Detected
    description: Used by multiple offensive tools including O365 credential stuffing and phishing frameworks
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)^aiohttp")
    severity: medium
    mitre: ["T1110"]
    tags: ["phishing", "aiohttp"]
    enabled: true

