# Threshold-Based Detection Rules
# These rules demonstrate threshold alerting - only triggering after N matches within a time window
# This is useful for detecting patterns like brute force, scanning, or anomalous behavior

description: "Threshold-based detection rules that trigger alerts after N events within a time window. Detects brute force attacks, port scanning, network reconnaissance, DoS attacks, C2 beaconing patterns, web application attacks, and lateral movement through rate-based analysis."

rules:
  # ========================================
  # Brute Force Detection
  # ========================================
  
  # SSH Brute Force - multiple connection attempts to SSH
  - name: SSH Brute Force
    description: Alert when 50+ SSH connection attempts detected within 120 seconds
    type: TCP
    expression: DstPort == 22 && SYN && !ACK
    severity: critical
    mitre: ["T1110.001", "T1021.004"]
    tags: ["brute-force"]
    enabled: true
    threshold: 50
    threshold_window: 120

  # RDP Brute Force - multiple connection attempts to RDP
  - name: RDP Brute Force
    description: Alert when 30+ RDP connection attempts detected within 120 seconds
    type: TCP
    expression: DstPort == 3389 && SYN && !ACK
    severity: critical
    mitre: ["T1110.001", "T1021.001"]
    tags: ["brute-force"]
    enabled: true
    threshold: 30
    threshold_window: 120

  # Web Login Brute Force - multiple POST requests to login endpoints
  - name: Web Login Brute Force
    description: Alert when 100+ POST requests to login endpoints within 300 seconds
    type: HTTP
    expression: Method == "POST" && MatchesPattern(URL, "(?i)(login|signin|auth)")
    severity: high
    mitre: ["T1110.001"]
    tags: ["brute-force"]
    enabled: true
    threshold: 100
    threshold_window: 300

  # ========================================
  # Data Exfiltration
  # ========================================
  
  # High Volume External DNS Queries - potential DNS tunneling
  - name: DNS Tunneling Volume
    description: Alert when 200+ DNS queries to external hosts within 60 seconds
    type: DNS
    expression: len(Questions) > 0 && IsPublicIP(DstIP)
    severity: high
    mitre: ["T1071.004"]
    tags: ["tunneling"]
    enabled: true
    threshold: 200
    threshold_window: 60

  # Large File Upload Pattern - multiple large POST requests
  - name: Large Upload Pattern
    description: Alert when 20+ large HTTP POSTs (>100KB) detected within 600 seconds
    type: HTTP
    expression: Method == "POST" && ReqContentLength > 100000 && IsPublicIP(DstIP)
    severity: medium
    mitre: ["T1041", "T1567.002"]
    tags: ["exfiltration"]
    enabled: true
    threshold: 20
    threshold_window: 600

  # ========================================
  # Denial of Service
  # ========================================
  
  # SYN Flood Detection
  - name: SYN Flood Detection
    description: Alert when 1000+ SYN packets to same destination within 10 seconds
    type: TCP
    expression: SYN && !ACK && !RST
    severity: critical
    mitre: ["T1499.002"]
    tags: ["dos"]
    enabled: true
    threshold: 1000
    threshold_window: 10

  # UDP Flood Detection
  - name: UDP Flood Detection
    description: Alert when 1000+ UDP packets to same destination within 10 seconds
    type: UDP
    expression: PayloadSize > 0
    severity: critical
    mitre: ["T1499.002"]
    tags: ["dos"]
    enabled: true
    threshold: 1000
    threshold_window: 10

  # ========================================
  # Command and Control
  # ========================================
  
  # Beaconing Pattern - regular HTTP requests with small payloads
  - name: C2 Beaconing Pattern
    description: Alert when 50+ small HTTP GET/POST requests within 600 seconds
    type: HTTP
    expression: (Method == "GET" || Method == "POST") && ReqContentLength < 100 && IsPublicIP(DstIP)
    severity: high
    mitre: ["T1071.001"]
    tags: ["beaconing"]
    enabled: true
    threshold: 50
    threshold_window: 600

  # Suspicious DNS Beaconing - frequent queries to same domain
  - name: DNS Beaconing Pattern
    description: Alert when 100+ DNS queries to same domain within 600 seconds
    type: DNS
    expression: len(Questions) > 0 && IsPublicIP(DstIP)
    severity: medium
    mitre: ["T1071.004"]
    tags: ["beaconing"]
    enabled: true
    threshold: 100
    threshold_window: 600

  # ========================================
  # Web Application Attacks
  # ========================================
  
  # SQL Injection Attack Pattern
  - name: SQL Injection Attack Pattern
    description: Alert when 20+ SQL injection attempts detected within 300 seconds
    type: HTTP
    expression: MatchesPattern(URL, "(?i)(union.*select|insert.*into|delete.*from|drop.*table)")
    severity: critical
    mitre: ["T1190"]
    tags: ["sql-injection"]
    enabled: true
    threshold: 20
    threshold_window: 300

  # Directory Traversal Attack Pattern
  - name: Directory Traversal Attack Pattern
    description: Alert when 20+ directory traversal attempts detected within 300 seconds
    type: HTTP
    expression: MatchesPattern(URL, "\\.\\./|\\.\\.\\\\")
    severity: high
    mitre: ["T1083"]
    tags: ["path-traversal"]
    enabled: true
    threshold: 20
    threshold_window: 300

  # Web Scanner Activity
  - name: Web Scanner Activity
    description: Alert when 50+ requests with scanner user agents within 120 seconds
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)(nikto|nmap|masscan|sqlmap|burp|nessus|acunetix)")
    severity: medium
    mitre: ["T1595.002"]
    tags: ["scanner"]
    enabled: true
    threshold: 50
    threshold_window: 120

  # ========================================
  # Lateral Movement
  # ========================================
  
  # SMB Enumeration Pattern
  - name: SMB Enumeration Pattern
    description: Alert when 30+ internal SMB connections within 60 seconds
    type: TCP
    expression: DstPort == 445 && IsPrivateIP(SrcIP) && IsPrivateIP(DstIP) && SYN && !ACK
    severity: medium
    mitre: ["T1021.002", "T1135"]
    tags: ["lateral-movement"]
    enabled: true
    threshold: 30
    threshold_window: 60

  # Kerberos Authentication Spike
  - name: Kerberos Authentication Spike
    description: Alert when 100+ Kerberos packets within 120 seconds (potential ticket attacks)
    type: TCP
    expression: DstPort == 88 || SrcPort == 88
    severity: medium
    mitre: ["T1558.001", "T1558.003"]
    tags: ["lateral-movement"]
    enabled: true
    threshold: 100
    threshold_window: 120

  # ========================================
  # Anomalous Behavior
  # ========================================
  
  # Unusual Non-Standard Port Usage
  - name: High Port Activity
    description: Alert when 200+ connections to high ports (>49152) within 60 seconds
    type: TCP
    expression: DstPort > 49152 && SYN && !ACK
    severity: low
    mitre: ["T1571"]
    tags: ["anomaly"]
    enabled: true
    threshold: 200
    threshold_window: 60

  # Connection to Multiple External IPs
  - name: Multiple External Connections
    description: Alert when 100+ connections to external IPs within 60 seconds
    type: TCP
    expression: IsPublicIP(DstIP) && SYN && !ACK
    severity: low
    mitre: ["T1071"]
    tags: ["anomaly"]
    enabled: true
    threshold: 100
    threshold_window: 60

