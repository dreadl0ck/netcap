  # ========================================
  # YANDEX ECOSYSTEM
  # ========================================

  - name: Yandex Services Detected
    description: Yandex ecosystem services detected (Russian search engine and services)
    type: Connection
    expression: |
      "YANDEX" in Applications || "YANDEX_MAIL" in Applications || 
      "YANDEX_MUSIC" in Applications || "YANDEX_MARKET" in Applications || 
      "YANDEX_DISK" in Applications || "YANDEX_CLOUD" in Applications || 
