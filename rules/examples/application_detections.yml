# Application Detection Rules Based on go-dpi
# These rules detect specific applications and application categories using DPI
# Rules are organized by logical application groups

description: "Application-layer detection rules using deep packet inspection (DPI) to identify specific applications and services including gaming, streaming, social media, messaging, video conferencing, cloud storage, VPN services, P2P file sharing, cryptocurrency, and enterprise business applications."

rules:
  # ========================================
  # GAMING APPLICATIONS
  # ========================================

  - name: Gaming Applications Detected
    description: Gaming applications detected including Steam, Xbox, PlayStation, Nintendo, and popular online games
    type: Connection
    expression: |
      "STEAM" in Applications || "XBOX" in Applications || 
      "PLAYSTATION" in Applications || "PSN_STORE" in Applications || 
      "NINTENDO" in Applications || "WORLDOFWARCRAFT" in Applications || 
      "WOW" in Applications || "BATTLEFIELD" in Applications || 
      "HALFLIFE2" in Applications || "CSGO" in Applications || 
      "DOTA2" in Applications || "STARCRAFT" in Applications || 
      "GUILDWARS" in Applications || "GUILDWARS2" in Applications || 
      "MAPLESTORY" in Applications || "ARMAGETRON" in Applications || 
      "DOFUS" in Applications || "FIESTA" in Applications || 
      "FLORENSIA" in Applications || "WORLD_OF_KUNG_FU" in Applications || 
      "HEARTHSTONE" in Applications || "DIABLO3" in Applications || 
      "MINECRAFT" in Applications || "TRACKMANIA" in Applications || 
      "CONQUER" in Applications || "WARCRAFT3" in Applications || 
      "RUNESCAPE" in Applications || "SECONDLIFE" in Applications || 
      "CLASH_OF_CLANS" in Applications || "ROBLOX" in Applications || 
      "AMONG_US" in Applications || "GENSHIN_IMPACT" in Applications || 
      "EPICGAMES" in Applications || "ACTIVISION" in Applications || 
      "RIOTGAMES" in Applications || "ELECTRONICARTS" in Applications || 
      "EA_GAMES" in Applications || "BLIZZARD" in Applications || 
      "OVERWATCH" in Applications || "PATHOFEXILE" in Applications || 
      "TESO" in Applications || "LOLWILDRIFT" in Applications || 
      "HOTS" in Applications || "HOTS_NEW" in Applications || 
      "DESTINY" in Applications || "THE_DIVISION" in Applications || 
      "BLACKDESERT" in Applications || "CROSSFIRE" in Applications || 
      "FINALFANTASY_XIV" in Applications || "TERA" in Applications || 
      "SILKROADONLINE" in Applications || "TETRISONLINE" in Applications || 
      "RAGNAROK_ONLINE" in Applications || "WIZARD101" in Applications || 
      "KINGOFGLORY" in Applications || "DNF" in Applications || 
      "SKYFORGE" in Applications || "SMITE" in Applications || 
      "GEFORCENOW" in Applications || "BLACKNUT" in Applications || 
      "BOOSTEROID" in Applications || "COD_MOBILE" in Applications || 
      "COD_WAW" in Applications || "MUMBLE" in Applications || 
      "NEXON" in Applications || "TENCENTGAMES" in Applications || 
      "NETEASE_GAMES" in Applications || "GAIJIN" in Applications || 
      "ROCKSTAR_GAMES" in Applications
    severity: info
    tags: ["gaming"]
    enabled: true

  # ========================================
  # STREAMING & MEDIA
  # ========================================

  - name: Video Streaming Services Detected
    description: Video streaming services detected including Netflix, YouTube, Hulu, Disney+, HBO, Amazon Video, etc.
    type: Connection
    expression: |
      "NETFLIX" in Applications || "YOUTUBE" in Applications || 
      "YOUTUBE_UPLOAD" in Applications || "HULU" in Applications || 
      "DISNEYPLUS" in Applications || "HBO" in Applications || 
      "AMAZON_VIDEO" in Applications || "TWITCH" in Applications || 
      "VIMEO" in Applications || "DAILYMOTION" in Applications || 
      "LIVESTREAM" in Applications || "IQIYI" in Applications || 
      "IFLIX" in Applications || "PPLIVE" in Applications || 
      "PPSTREAM" in Applications || "SOPCAST" in Applications || 
      "TVANTS" in Applications || "TVUPLAYER" in Applications || 
      "ZATTOO" in Applications || "PS_VUE" in Applications || 
      "APPLETVPLUS" in Applications || "DIRECTV" in Applications || 
      "VUDU" in Applications || "SHOWTIME" in Applications || 
      "TENCENTVIDEO" in Applications || "DAZN" in Applications || 
      "PARAMOUNTPLUS" in Applications || "ESPN" in Applications || 
      "KICK" in Applications || "TIKTOK" in Applications || 
      "RUMBLE" in Applications || "RUTUBE" in Applications
    severity: info
    tags: ["streaming"]
    enabled: true

  - name: Music Streaming Services Detected
    description: Music streaming services detected including Spotify, Pandora, Deezer, Apple Music, etc.
    type: Connection
    expression: |
      "SPOTIFY" in Applications || "PANDORA" in Applications || 
      "DEEZER" in Applications || "SOUNDCLOUD" in Applications || 
      "LASTFM" in Applications || "IHEARTRADIO" in Applications || 
      "TIDAL" in Applications || "TUNEIN" in Applications || 
      "SIRIUSXMRADIO" in Applications || "SHOUTCAST" in Applications || 
      "ICECAST" in Applications || "APPLE_ITUNES" in Applications || 
      "YANDEX_MUSIC" in Applications
    severity: info
    tags: ["streaming"]
    enabled: true

  # ========================================
  # SOCIAL MEDIA & COMMUNICATION
  # ========================================

  - name: Social Media Applications Detected
    description: Social media platforms detected including Facebook, Twitter, Instagram, TikTok, LinkedIn, etc.
    type: Connection
    expression: |
      "FACEBOOK" in Applications || "FACEBOOK_MESSENGER" in Applications || 
      "FACEBOOK_VOIP" in Applications || "FACEBOOK_REEL_STORY" in Applications || 
      "TWITTER" in Applications || "INSTAGRAM" in Applications || 
      "TIKTOK" in Applications || "SNAPCHAT" in Applications || 
      "SNAPCHAT_CALL" in Applications || "LINKEDIN" in Applications || 
      "PINTEREST" in Applications || "REDDIT" in Applications || 
      "TUMBLR" in Applications || "BLUESKY" in Applications || 
      "MASTODON" in Applications || "THREADS" in Applications || 
      "VK" in Applications || "SINA" in Applications || 
      "SINA_WEIBO" in Applications || "WEIBO" in Applications || 
      "QQ" in Applications || "WECHAT" in Applications || 
      "BADOO" in Applications || "LIKEE" in Applications
    severity: info
    tags: ["social-media"]
    enabled: true

  - name: Instant Messaging Applications Detected
    description: Instant messaging applications detected including WhatsApp, Telegram, Signal, Viber, etc.
    type: Connection
    expression: |
      "WHATSAPP" in Applications || "WHATSAPP_CALL" in Applications || 
      "WHATSAPP_FILES" in Applications || "TELEGRAM" in Applications || 
      "TELEGRAM_VOIP" in Applications || "SIGNAL" in Applications || 
      "SIGNAL_VOIP" in Applications || "VIBER" in Applications || 
      "VIBER_VOIP" in Applications || "MESSENGER" in Applications || 
      "SLACK" in Applications || "DISCORD" in Applications || 
      "SKYPE" in Applications || "SKYPE_CALL" in Applications || 
      "SKYPE_TCP" in Applications || "KIK" in Applications || 
      "LINE" in Applications || "LINE_NEW" in Applications || 
      "LINE_CALL" in Applications || "KAKAOTALK" in Applications || 
      "KAKAOTALK_VOICE" in Applications || "IMO" in Applications || 
      "THREEMA" in Applications || "JABBER" in Applications || 
      "UNENCRYPTED_JABBER" in Applications || "XMPP" in Applications || 
      "XMPPS" in Applications || "ICQ" in Applications || 
      "IRC" in Applications || "MSN" in Applications || 
      "YAHOO" in Applications || "DINGTALK" in Applications || 
      "NAVER" in Applications
    severity: info
    tags: ["messaging"]
    enabled: true

  # ========================================
  # VIDEO CONFERENCING
  # ========================================

  - name: Video Conferencing Applications Detected
    description: Video conferencing applications detected including Zoom, Teams, Webex, Google Meet, etc.
    type: Connection
    expression: |
      "ZOOM" in Applications || "MSTEAMS" in Applications || 
      "MSTEAMS_CALL" in Applications || "WEBEX" in Applications || 
      "WEBEX_STUN" in Applications || "GOOGLE_MEET" in Applications || 
      "GOOGLE_CALL" in Applications || "GOOGLE_HANGOUTS" in Applications || 
      "HANGOUT_DUO" in Applications || "TEAMVIEWER" in Applications || 
      "ANYDESK" in Applications || "GOTO" in Applications || 
      "GOTOMEETING" in Applications || "ADOBE_CONNECT" in Applications || 
      "FUZE" in Applications || "CLASSIN" in Applications
    severity: info
    tags: ["video-conferencing"]
    enabled: true

  # ========================================
  # CLOUD STORAGE & FILE SHARING
  # ========================================

  - name: Cloud Storage Services Detected
    description: Cloud storage services detected including Dropbox, Google Drive, OneDrive, iCloud, etc.
    type: Connection
    expression: |
      "DROPBOX" in Applications || "GOOGLE_DRIVE" in Applications || 
      "MS_ONE_DRIVE" in Applications || "APPLE_ICLOUD" in Applications || 
      "ICLOUD_PRIVATE_RELAY" in Applications || "YANDEX_DISK" in Applications || 
      "YANDEX_CLOUD" in Applications || "SYNCTHING" in Applications || 
      "BTSYNC" in Applications || "IDRIVE_SYNC" in Applications
    severity: info
    tags: ["cloud-storage"]
    enabled: true

  # ========================================
  # E-COMMERCE & SHOPPING
  # ========================================

  - name: E Commerce Applications Detected
    description: E-commerce and shopping platforms detected including Amazon, eBay, Alibaba, etc.
    type: Connection
    expression: |
      "AMAZON" in Applications || "EBAY" in Applications || 
      "ALIBABA" in Applications || "TAOBAO" in Applications || 
      "TAOBAO_NEW" in Applications || "FLIGGY" in Applications || 
      "SHEIN" in Applications || "TEMU" in Applications
    severity: info
    tags: ["e-commerce"]
    enabled: true

  # ========================================
  # CLOUD SERVICES & CDN
  # ========================================

  - name: Major Cloud Providers Detected
    description: Major cloud service providers detected including AWS, Azure, Google Cloud, Alibaba Cloud, etc.
    type: Connection
    expression: |
      "AMAZON_AWS" in Applications || "AWS_COGNITO" in Applications || 
      "AWS_API_GATEWAY" in Applications || "AWS_KINESIS" in Applications || 
      "AWS_EC2" in Applications || "AWS_EMR" in Applications || 
      "AWS_S3" in Applications || "AWS_CLOUDFRONT" in Applications || 
      "AWS_DYNAMODB" in Applications || "MICROSOFT_AZURE" in Applications || 
      "GOOGLE_CLOUD" in Applications || "ALIBABA" in Applications || 
      "ALICLOUD" in Applications || "HUAWEI_CLOUD" in Applications || 
      "DIGITALOCEAN" in Applications || "CLOUDFLARE" in Applications || 
      "CLOUDFLARE_WARP" in Applications || "AKAMAI" in Applications || 
      "EDGECAST" in Applications || "CACHEFLY" in Applications || 
      "MERAKI_CLOUD" in Applications
    severity: info
    tags: ["cloud"]
    enabled: true

  # ========================================
  # VPN & PROXY SERVICES
  # ========================================

  - name: VPN Services Detected
    description: VPN services detected including commercial VPN providers and tunneling protocols
    type: Connection
    expression: |
      "OPENVPN" in Applications || "WIREGUARD" in Applications || 
      "NORDVPN" in Applications || "SURFSHARK" in Applications || 
      "PROTONVPN" in Applications || "MULLVAD" in Applications || 
      "HOTSPOT_SHIELD" in Applications || "TUNNELBEAR" in Applications || 
      "PSIPHON" in Applications || "ULTRASURF" in Applications || 
      "OPERA_VPN" in Applications || "PIA" in Applications || 
      "CACTUSVPN" in Applications || "WINDSCRIBE" in Applications || 
      "SOFTETHER" in Applications || "HAMACHI" in Applications || 
      "TAILSCALE" in Applications || "VPN_UNLIMITED" in Applications || 
      "VPNROBOT" in Applications || "TURBOVPN" in Applications || 
      "SNAPVPN" in Applications || "VPNMASTER" in Applications || 
      "CISCOVPN" in Applications || "CISCO_VPN" in Applications || 
      "FORTICLIENT" in Applications || "PPTP" in Applications || 
      "L2TP" in Applications || "TEREDO" in Applications || 
      "TOR" in Applications || "SOCKS" in Applications || 
      "SOCKS4" in Applications || "SOCKS5" in Applications || 
      "HTTP_PROXY" in Applications || "HTTP_TUNNEL" in Applications
    severity: medium
    mitre: ["T1090"]
    tags: ["vpn"]
    enabled: true

  # ========================================
  # REMOTE ACCESS
  # ========================================

  - name: Remote Access Applications Detected
    description: Remote access and remote desktop applications detected
    type: Connection
    expression: |
      "RDP" in Applications || "VNC" in Applications || 
      "TEAMVIEWER" in Applications || "ANYDESK" in Applications || 
      "CITRIX" in Applications || "PCANYWHERE" in Applications || 
      "RADMIN" in Applications || "REALVNC" in Applications || 
      "NOMACHINE" in Applications || "NOMACHINE_NEW" in Applications || 
      "REMOTE_MANIPULATOR" in Applications || "SSH" in Applications || 
      "TELNET" in Applications || "RSH" in Applications || 
      "VMWARE" in Applications
    severity: low
    mitre: ["T1021"]
    tags: ["remote-access"]
    enabled: true

  # ========================================
  # DEVELOPMENT & IT TOOLS
  # ========================================

  - name: Development Tools Detected
    description: Development and IT tools detected including Git, GitHub, GitLab, databases, etc.
    type: Connection
    expression: |
      "GIT" in Applications || "GITHUB" in Applications || 
      "GITLAB" in Applications || "MONGODB" in Applications || 
      "MONGO" in Applications || "REDIS" in Applications || 
      "ELASTICSEARCH" in Applications || "CASSANDRA" in Applications || 
      "POSTGRES" in Applications || "POSTGRESQL" in Applications || 
      "MYSQL" in Applications || "MSSQL_TDS" in Applications || 
      "ORACLE" in Applications || "CLICKHOUSE" in Applications
    severity: info
    tags: ["development"]
    enabled: true

  # ========================================
  # BUSINESS & PRODUCTIVITY
  # ========================================

  - name: Business Productivity Applications Detected
    description: Business and productivity applications detected including Office 365, Google Workspace, Salesforce, etc.
    type: Connection
    expression: |
      "OFFICE_365" in Applications || "MICROSOFT_365" in Applications || 
      "GOOGLE_DOCS" in Applications || "GOOGLE_CLASSROOM" in Applications || 
      "GOOGLE_SERVICES" in Applications || "SALESFORCE" in Applications || 
      "SLACK" in Applications || "MSTEAMS" in Applications || 
      "ZOOM" in Applications || "WEBEX" in Applications || 
      "LOTUS_NOTES" in Applications || "HCL_NOTES" in Applications || 
      "SAP" in Applications || "BLOOMBERG" in Applications || 
      "PLURALSIGHT" in Applications
    severity: info
    tags: ["business"]
    enabled: true

  # ========================================
  # MAIL SERVICES
  # ========================================

  - name: Web Mail Services Detected
    description: Web-based email services detected including Gmail, Outlook, Yahoo Mail, etc.
    type: Connection
    expression: |
      "GMAIL" in Applications || "HOTMAIL" in Applications || 
      "MS_OUTLOOK" in Applications || "YAHOO" in Applications || 
      "YANDEX_MAIL" in Applications
    severity: info
    tags: ["email"]
    enabled: true

  # ========================================
  # P2P & FILE SHARING
  # ========================================

  - name: P2P Applications Detected
    description: Peer-to-peer file sharing applications detected including BitTorrent, eMule, etc.
    type: Connection
    expression: |
      "BITTORRENT" in Applications || "EMULE" in Applications || 
      "GNUTELLA" in Applications || "EDONKEY" in Applications || 
      "ARES" in Applications || "NAPSTER" in Applications || 
      "DIRECTCONNECT" in Applications || "DC" in Applications || 
      "FASTTRACK" in Applications || "OPENFT" in Applications || 
      "SOULSEEK" in Applications || "APPLEJUICE" in Applications || 
      "KONTIKI" in Applications || "PANDO" in Applications || 
      "THUNDER" in Applications || "XUNLEI" in Applications || 
      "XUNLEI_ACCEL" in Applications || "AZUREUS" in Applications || 
      "ACESTREAM" in Applications || "IPFS" in Applications
