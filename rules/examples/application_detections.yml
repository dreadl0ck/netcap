      "CNN" in Applications || "ESPN" in Applications || 
      "WIKIPEDIA" in Applications || "MOZILLA" in Applications || 
      "ACCUWEATHER" in Applications
    severity: info
    tags: ["news", "media", "web"]
    enabled: true

  # ========================================
  # APPLE ECOSYSTEM
  # ========================================

  - name: Apple Services Detected
    description: Apple ecosystem services detected including iCloud, iTunes, App Store, Siri, etc.
    type: Connection
    expression: |
      "APPLE" in Applications || "APPLE_ICLOUD" in Applications || 
      "APPLE_ITUNES" in Applications || "APPLE_PUSH" in Applications || 
      "APPLE_SIRI" in Applications || "APPLESTORE" in Applications || 
      "APPLETVPLUS" in Applications || "ICLOUD_PRIVATE_RELAY" in Applications
