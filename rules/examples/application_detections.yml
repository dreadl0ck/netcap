      "WECHAT" in Applications || "QQ" in Applications || 
      "TENCENT" in Applications || "TENCENT_GAMES" in Applications || 
      "TENCENTGAMES" in Applications || "TENCENTVIDEO" in Applications || 
      "ALIBABA" in Applications || "ALICLOUD" in Applications || 
      "TAOBAO" in Applications || "TAOBAO_NEW" in Applications || 
      "BADBAIDU" in Applications || "WEIBO" in Applications || 
      "SINA" in Applications || "SINA_WEIBO" in Applications || 
      "DOUYU" in Applications || "DOUYU_CHAT" in Applications || 
      "YOUKU" in Applications || "IQIYI" in Applications || 
      "QQLIVE" in Applications || "KANKAN" in Applications || 
      "FUNSHION" in Applications || "BAOFENG" in Applications || 
      "XIAMI" in Applications || "DIANPING" in Applications || 
