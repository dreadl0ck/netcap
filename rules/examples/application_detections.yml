  # ========================================
  # CRYPTOCURRENCY & BLOCKCHAIN
  # ========================================

  - name: Cryptocurrency Applications Detected
    description: Cryptocurrency and blockchain applications detected
    type: Connection
    expression: |
      "BITCOIN" in Applications || "BITCOIN_NEW" in Applications || 
      "ETHEREUM" in Applications || "MONERO" in Applications || 
      "LITECOIN" in Applications || "DOGECOIN" in Applications || 
      "DASH" in Applications || "TENFIVECOIN" in Applications || 
      "ANTCOIN" in Applications || "MINING" in Applications || 
      "STRATUM" in Applications || "NANO" in Applications
    severity: medium
    mitre: ["T1496"]
    tags: ["cryptocurrency"]
    enabled: true

  # ========================================
  # MALWARE & SUSPICIOUS
  # ========================================

  - name: Malware Related Applications Detected
    description: Known malware, trojans, or suspicious applications detected
    type: Connection
    expression: |
      "TROJAN_WIN32_GENERIC_SB" in Applications || 
      "TROJAN_ZEROACCESS" in Applications || 
      "GLUPTEBA" in Applications || "BADBAIDU" in Applications || 
      "INVALID_BT" in Applications || "INVALID_HTTP" in Applications || 
      "INVALID_SMTP" in Applications || "INVALID_POP3" in Applications || 
      "TELNET_EXPLOIT" in Applications || "VXWORKS_EXPLOIT" in Applications || 
      "CHARGEN_EXPLOIT" in Applications || "STORM_WORM" in Applications || 
      "WORM_22105" in Applications
    severity: critical
    mitre: ["T1071", "T1568", "T1105"]
    tags: ["malware"]
    enabled: true

  # ========================================
  # ADULT CONTENT
  # ========================================

  - name: Adult Content Detected
    description: Adult content websites or services detected
    type: Connection
    expression: '"ADULT_CONTENT" in Applications'
    severity: low
    tags: ["policy-violation"]
    enabled: true

  # ========================================
  # ADVERTISING & ANALYTICS
  # ========================================

  - name: Advertising Analytics Detected
    description: Advertising and analytics tracking services detected
    type: Connection
    expression: |
      "ADS_ANALYTICS_TRACK" in Applications || 
      "YANDEX_METRIKA" in Applications || 
      "YANDEX_DIRECT" in Applications
