      "MSTEAMS" in Applications || "MSTEAMS_CALL" in Applications || 
      "MS_OUTLOOK" in Applications || "OFFICE_365" in Applications || 
      "WINDOWS_UPDATE" in Applications || "MSDO" in Applications
    severity: info
    tags: ["microsoft", "cloud", "business"]
    enabled: true

  # ========================================
  # GOOGLE ECOSYSTEM
  # ========================================

  - name: Google Services Detected
    description: Google ecosystem services detected including Search, YouTube, Drive, Meet, etc.
    type: Connection
    expression: |
      "GOOGLE" in Applications || "GOOGLE_DRIVE" in Applications || 
      "GOOGLE_DOCS" in Applications || "GOOGLE_MAPS" in Applications || 
      "GOOGLE_CLOUD" in Applications || "GOOGLE_SERVICES" in Applications || 
