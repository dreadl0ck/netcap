# Security-Relevant Port Detection Rules
# These rules detect traffic on ports associated with security-relevant protocols
# Generated from important_ports.csv - monitoring critical infrastructure and attack vectors

description: "Port-based detection rules for monitoring critical infrastructure protocols, legacy cleartext services, database servers, remote access tools, and common attack vectors. Includes both internal and external connection monitoring."

rules:
  # ========================================
  # CRITICAL RISK PORTS (Cleartext/Legacy Protocols)
  # ========================================

  # Port 20-21: FTP (Cleartext)
  - name: FTP Data Channel Detected
    description: FTP data channel detected (cleartext file transfers) - cleartext credentials risk
    type: TCP
    expression: DstPort == 20 || SrcPort == 20
    severity: medium
    mitre: ["T1071.002"]
    tags: ["cleartext"]
    enabled: true

  - name: FTP Control Channel Detected
    description: FTP control channel detected (cleartext authentication & commands) - use SFTP/FTPS instead
    type: TCP
    expression: DstPort == 21 || SrcPort == 21
    severity: high
    mitre: ["T1071.002", "T1078"]
    tags: ["cleartext", "legacy"]
    enabled: true

  # Port 22: SSH
  - name: SSH Connection Detected
    description: SSH connection detected - secure shell for remote admin (monitor for brute-force and stolen keys)
    type: TCP
    expression: DstPort == 22 || SrcPort == 22
    severity: low
    mitre: ["T1021.004", "T1110.001"]
    tags: ["remote-access"]
    enabled: true

  # Port 23: Telnet (Insecure Legacy)
  - name: Telnet Detected
    description: Telnet detected (legacy cleartext protocol) - insecure, should be disabled and replaced with SSH
    type: TCP
    expression: DstPort == 23 || SrcPort == 23
    severity: critical
    mitre: ["T1021.004"]
    tags: ["cleartext", "legacy"]
    enabled: true

  # Port 69: TFTP
  - name: TFTP Detected
    description: TFTP detected (unauthenticated file transfer) - often used in device provisioning
    type: TCP
    expression: DstPort == 69 || SrcPort == 69
    severity: high
    mitre: ["T1071.002"]
    tags: ["unauthenticated"]
    enabled: true

  # Port 80: HTTP
  - name: HTTP Traffic Detected
    description: Unencrypted HTTP traffic detected
    type: TCP
    expression: DstPort == 80 || SrcPort == 80
    severity: info
    mitre: ["T1071.001", "T1190"]
    tags: ["cleartext"]
    enabled: true

  # Port 443: HTTPS
  - name: HTTPS Traffic Detected
    description: HTTPS traffic detected - monitor for web-based remote admin and exfiltration
    type: TCP
    expression: DstPort == 443 || SrcPort == 443
    severity: info
    mitre: ["T1071.001", "T1041"]
    tags: ["encrypted", "web"]
    enabled: true

  # Port 135: Windows RPC
  - name: Windows RPC Detected
    description: Windows RPC endpoint mapper detected - used in reconnaissance and lateral movement
    type: TCP
    expression: DstPort == 135 || SrcPort == 135
    severity: high
    mitre: ["T1021.003", "T1047"]
    tags: ["lateral-movement"]
    enabled: true

  # Port 137-139: NetBIOS (Windows Legacy)
  - name: NetBIOS Name Service Detected
    description: NetBIOS name service detected (Windows legacy) - information leakage risk
    type: TCP
    expression: DstPort == 137 || SrcPort == 137
    severity: high
    mitre: ["T1016", "T1018"]
    tags: ["legacy"]
    enabled: true

  - name: NetBIOS Datagram Detected
    description: NetBIOS datagram service detected (legacy) - should be blocked externally
    type: TCP
    expression: DstPort == 138 || SrcPort == 138
    severity: high
    mitre: ["T1016"]
    tags: ["legacy"]
    enabled: true

  - name: NetBIOS Session Detected
    description: NetBIOS session service detected (legacy SMB transport) - block on internet-facing interfaces
    type: TCP
    expression: DstPort == 139 || SrcPort == 139
    severity: high
    mitre: ["T1021.002"]
    tags: ["legacy"]
    enabled: true

  # Port 161: SNMP
  - name: SNMP Detected
    description: SNMP detected - default community strings leak info, use SNMPv3 with strong auth
    type: TCP
    expression: DstPort == 161 || SrcPort == 161
    severity: medium
    mitre: ["T1046", "T1592.001"]
    tags: ["information-disclosure"]
    enabled: true

  # Port 389: LDAP (Cleartext)
  - name: LDAP Cleartext Detected
    description: LDAP detected (cleartext) - information disclosure and auth abuse risk, prefer LDAPS (636)
    type: TCP
    expression: DstPort == 389 || SrcPort == 389
    severity: high
    mitre: ["T1087.002", "T1069.002"]
    tags: ["cleartext"]
    enabled: true

  # Port 445: SMB
  - name: SMB Traffic Detected
    description: SMB file sharing detected - frequent vector for ransomware and lateral movement
    type: TCP
    expression: DstPort == 445 || SrcPort == 445
    severity: critical
    mitre: ["T1021.002", "T1570", "T1486"]
    tags: ["ransomware", "lateral-movement"]
    enabled: true

  # Port 1080: SOCKS Proxy
  - name: SOCKS Proxy Detected
    description: SOCKS proxy detected - often used for tunneling and exfiltration
    type: TCP
    expression: DstPort == 1080 || SrcPort == 1080
    severity: medium
    mitre: ["T1090.001", "T1572"]
    tags: ["proxy", "tunneling"]
    enabled: true

  # Port 1337: Leet Port
  - name: Port 1337 Detected
    description: Traffic on port 1337 detected - unusual port often used by malware, backdoors, and hackers
    type: TCP
    expression: DstPort == 1337 || SrcPort == 1337
    severity: high
    mitre: ["T1071.001"]
    tags: ["suspicious", "backdoor", "unusual-port"]
    enabled: true

  # Port 1433: Microsoft SQL Server
  - name: MSSQL Detected
    description: Microsoft SQL Server detected - exposed DBs risk data breach/RCE
    type: TCP
    expression: DstPort == 1433 || SrcPort == 1433
    severity: medium
    mitre: ["T1190", "T1078.001"]
    tags: ["database"]
    enabled: true

  # Port 1434: MSSQL Browser (UDP)
  - name: MSSQL Browser Service Detected
    description: Microsoft SQL Server Browser Service detected - enumerates SQL instances, disable if not needed
    type: UDP
    expression: DstPort == 1434 || SrcPort == 1434
    severity: high
    mitre: ["T1046", "T1590.001"]
    tags: ["database", "enumeration"]
    enabled: true

  # Port 1521: Oracle Database
  - name: Oracle Database Detected
    description: Oracle database listener detected - protect and restrict to app tier
    type: TCP
    expression: DstPort == 1521 || SrcPort == 1521
    severity: critical
    mitre: ["T1190", "T1078.001"]
    tags: ["database"]
    enabled: true

  # Port 1723: PPTP VPN
  - name: PPTP VPN Detected
    description: PPTP VPN detected - weak crypto, avoid and use modern VPNs
    type: TCP
    expression: DstPort == 1723 || SrcPort == 1723
    severity: high
    mitre: ["T1133"]
    tags: ["weak-crypto", "legacy"]
    enabled: true

  # Port 2049: NFS
  - name: NFS Detected
    description: Network File System detected - file-share exposures lead to data theft and ransomware
    type: TCP
    expression: DstPort == 2049 || SrcPort == 2049
    severity: critical
    mitre: ["T1039", "T1005"]
    tags: ["ransomware"]
    enabled: true

  # Port 2375: Docker API (Unencrypted)
  - name: Docker API Unencrypted Detected
    description: Docker remote API detected (unencrypted) - exposed API permits container and host takeover
    type: TCP
    expression: DstPort == 2375 || SrcPort == 2375
    severity: critical
    mitre: ["T1610", "T1133"]
    tags: ["exposure", "rce"]
    enabled: true

  # Port 3306: MySQL/MariaDB
  - name: MySQL Detected
    description: MySQL/MariaDB database detected - protect with network ACLs
    type: TCP
    expression: DstPort == 3306 || SrcPort == 3306
    severity: critical
    mitre: ["T1190", "T1078.001"]
    tags: ["database"]
    enabled: true

  # Port 3389: RDP
  - name: RDP Detected
    description: Remote Desktop Protocol detected - common ransomware vector, require VPN + MFA
    type: TCP
    expression: DstPort == 3389 || SrcPort == 3389
    severity: critical
    mitre: ["T1021.001", "T1110.001"]
    tags: ["remote-desktop", "ransomware"]
    enabled: true

  # Port 5900: VNC
  - name: VNC Detected
    description: VNC remote desktop detected - often unauthenticated or weak auth
    type: TCP
    expression: DstPort == 5900 || SrcPort == 5900
    severity: critical
    mitre: ["T1021.005"]
    tags: ["remote-desktop"]
    enabled: true

  # Port 6379: Redis
  - name: Redis Detected
    description: Redis detected (often no auth by default) - exposed instances can be commandeered
    type: TCP
    expression: DstPort == 6379 || SrcPort == 6379
    severity: critical
    mitre: ["T1190"]
    tags: ["database"]
    enabled: true

  # Port 27017: MongoDB
  - name: MongoDB Detected
    description: MongoDB detected - historically leaked unsecured DBs, never expose without auth and encryption
    type: TCP
    expression: DstPort == 27017 || SrcPort == 27017
    severity: critical
    mitre: ["T1190"]
    tags: ["database"]
    enabled: true

  # ========================================
  # HIGH RISK PORTS (Monitoring Recommended)
  # ========================================

  # Port 25: SMTP
  - name: SMTP Detected
    description: SMTP mail transfer detected - monitor for open relays and outbound spam
    type: TCP
    expression: DstPort == 25 || SrcPort == 25
    severity: medium
    mitre: ["T1071.003"]
    tags: ["email"]
    enabled: true

  # Port 53: DNS
  - name: DNS Traffic Detected
    description: DNS detected - abuse for amplification and exfiltration, restrict recursion
    type: TCP
    expression: DstPort == 53 || SrcPort == 53
    severity: info
    mitre: ["T1071.004", "T1048.003"]
    tags: ["amplification"]
    enabled: true

  # Port 67-68: DHCP
  - name: DHCP Server Detected
    description: DHCP server detected - rogue DHCP can hijack traffic
    type: TCP
    expression: DstPort == 67 || SrcPort == 67
    severity: medium
    mitre: ["T1557.002"]
    tags: ["rogue-server"]
    enabled: true

  # Port 110: POP3
  - name: POP3 Detected
    description: POP3 mail retrieval detected (cleartext) - use TLS variants
    type: TCP
    expression: DstPort == 110 || SrcPort == 110
    severity: medium
    mitre: ["T1114.001"]
    tags: ["email", "cleartext"]
    enabled: true

  # Port 123: NTP
  - name: NTP Detected
    description: NTP detected - amplification DDoS risk, validate and limit sources
    type: TCP
    expression: DstPort == 123 || SrcPort == 123
    severity: info
    mitre: ["T1498.002"]
    tags: ["amplification"]
    enabled: true

  # Port 143: IMAP
  - name: IMAP Detected
    description: IMAP mail retrieval detected (often cleartext) - prefer IMAPS (993)
    type: TCP
    expression: DstPort == 143 || SrcPort == 143
    severity: medium
    mitre: ["T1114.001"]
    tags: ["email", "cleartext"]
    enabled: true

  # Port 162: SNMP Trap
  - name: SNMP Trap Detected
    description: SNMP traps/notifications detected - monitor for unexpected trap sources
    type: TCP
    expression: DstPort == 162 || SrcPort == 162
    severity: medium
    mitre: ["T1046"]
    tags: ["monitoring"]
    enabled: true

  # Port 179: BGP
  - name: BGP Detected
    description: Border Gateway Protocol detected - routing hijacks have large impact
    type: TCP
    expression: DstPort == 179 || SrcPort == 179
    severity: high
    mitre: ["T1557.002"]
    tags: ["routing"]
    enabled: true

  # Port 194: IRC
  - name: IRC Detected
    description: IRC detected (legacy command/control) - can be abused for C2
    type: TCP
    expression: DstPort == 194 || SrcPort == 194
    severity: medium
    mitre: ["T1071.001"]
    tags: ["c2", "legacy"]
    enabled: true

  # Ports 6660-6669: IRC Extended Range
  - name: IRC Extended Range Detected
    description: IRC traffic on ports 6660-6669 detected - can be used for C2 communication
    type: TCP
    expression: (DstPort >= 6660 && DstPort <= 6669) || (SrcPort >= 6660 && SrcPort <= 6669)
    severity: medium
    mitre: ["T1071.001"]
    tags: ["c2", "irc", "legacy"]
    enabled: true

  # Port 465: SMTPS (deprecated)
  - name: SMTPS Deprecated Detected
    description: SMTP over SSL/TLS detected (deprecated port) - enforce modern TLS and auth
    type: TCP
    expression: DstPort == 465 || SrcPort == 465
    severity: medium
    mitre: ["T1071.003"]
    tags: ["email", "deprecated"]
    enabled: true

  # Port 514: Syslog
  - name: Syslog Detected
    description: Syslog detected - ensure logs are authenticated and protected from tampering
    type: TCP
    expression: DstPort == 514 || SrcPort == 514
    severity: low
    mitre: ["T1070.002"]
    tags: ["logging"]
    enabled: true

  # Port 587: SMTP Submission
  - name: SMTP Submission Detected
    description: Authenticated mail submission detected (client to MTA) - require TLS and strong auth
    type: TCP
    expression: DstPort == 587 || SrcPort == 587
    severity: medium
    mitre: ["T1071.003"]
    tags: ["email"]
    enabled: true

  # Port 631: IPP (Printing)
  - name: IPP Printing Detected
    description: Internet Printing Protocol detected - printers often insecure, isolate management
    type: TCP
    expression: DstPort == 631 || SrcPort == 631
    severity: medium
    mitre: ["T1559"]
    tags: ["printer"]
    enabled: true

  # Port 636: LDAPS
  - name: LDAPS Detected
    description: LDAP over TLS detected - preferred over plain LDAP
    type: TCP
    expression: DstPort == 636 || SrcPort == 636
    severity: low
    mitre: ["T1087.002"]
    tags: ["encrypted"]
    enabled: true

  # Port 686: LDAP over SSL
  - name: LDAP over SSL Detected
    description: LDAP over SSL detected (legacy port) - prefer LDAPS on port 636 for directory services
    type: TCP
    expression: DstPort == 686 || SrcPort == 686
    severity: low
    mitre: ["T1087.002", "T1069.002"]
    tags: ["encrypted", "ldap"]
    enabled: true

  # Port 873: rsync
  - name: Rsync Detected
    description: rsync remote file sync detected - auth and access controls necessary
    type: TCP
    expression: DstPort == 873 || SrcPort == 873
    severity: medium
    mitre: ["T1039"]
    tags: ["file-sync"]
    enabled: true

  # Port 989-990: FTPS
  - name: FTPS Data Detected
    description: FTP over TLS data channel detected - secure alternative to FTP
    type: TCP
    expression: DstPort == 989 || SrcPort == 989
    severity: medium
    mitre: ["T1071.002"]
    tags: ["encrypted"]
    enabled: true

  - name: FTPS Control Detected
    description: FTP over TLS control channel detected - prefer SFTP if possible
    type: TCP
    expression: DstPort == 990 || SrcPort == 990
    severity: medium
    mitre: ["T1071.002"]
    tags: ["encrypted"]
    enabled: true

  # Port 993: IMAPS
  - name: IMAPS Detected
    description: IMAP over TLS detected - preferred over IMAP, monitor auth patterns
    type: TCP
    expression: DstPort == 993 || SrcPort == 993
    severity: medium
    mitre: ["T1114.001"]
    tags: ["email", "encrypted"]
    enabled: true

  # Port 995: POP3S
  - name: POP3S Detected
    description: POP3 over TLS detected - preferred over POP3
    type: TCP
    expression: DstPort == 995 || SrcPort == 995
    severity: medium
    mitre: ["T1114.001"]
    tags: ["email", "encrypted"]
    enabled: true

  # Port 2082-2083: cPanel
  - name: cPanel HTTP Detected
    description: cPanel control panel detected (HTTP) - admin panels must be access-limited and patched
    type: TCP
    expression: DstPort == 2082 || SrcPort == 2082
    severity: medium
    mitre: ["T1078.004"]
    tags: ["admin-panel"]
    enabled: true

  - name: cPanel HTTPS Detected
    description: cPanel over HTTPS detected - secure admin traffic, still restrict access
    type: TCP
    expression: DstPort == 2083 || SrcPort == 2083
    severity: medium
    mitre: ["T1078.004"]
    tags: ["admin-panel"]
    enabled: true

  # Port 2222: Alternate SSH
  - name: Alternate SSH Detected
    description: Alternate SSH or admin panel port detected - obscurity only, enforce strong auth
    type: TCP
    expression: DstPort == 2222 || SrcPort == 2222
    severity: medium
    mitre: ["T1021.004"]
    tags: ["remote-access"]
    enabled: true

  # Port 22022: SSH Alternate
  - name: SSH Alternate Port 22022 Detected
    description: SSH on non-standard port 22022 detected - alternate SSH port for remote admin
    type: TCP
    expression: DstPort == 22022 || SrcPort == 22022
    severity: medium
    mitre: ["T1021.004"]
    tags: ["remote-access", "alternate-port"]
    enabled: true

  # Port 3391: RDP over UDP
  - name: RDP over UDP Detected
    description: RDP over UDP detected - used in RD Gateway configurations for improved performance
    type: UDP
    expression: DstPort == 3391 || SrcPort == 3391
    severity: critical
    mitre: ["T1021.001"]
    tags: ["remote-desktop", "rd-gateway"]
    enabled: true

  # Port 5504: RD Connection Broker
  - name: RD Connection Broker Detected
    description: Remote Desktop Connection Broker (RD Web Access) detected - part of RDS infrastructure
    type: TCP
    expression: DstPort == 5504 || SrcPort == 5504
    severity: high
    mitre: ["T1021.001"]
    tags: ["remote-desktop", "rd-gateway"]
    enabled: true

  # Port 5650: Remote Utilities
  - name: Remote Utilities Direct Connection Detected
    description: Remote Utilities direct connection detected - commercial remote access software
    type: TCP
    expression: DstPort == 5650 || SrcPort == 5650
    severity: high
    mitre: ["T1219"]
    tags: ["remote-access", "remote-utilities"]
    enabled: true

  # Port 5655: Remote Utilities Server
  - name: Remote Utilities Server Detected
    description: Remote Utilities server-side connection detected - monitor for unauthorized remote access
    type: TCP
    expression: DstPort == 5655 || SrcPort == 5655
    severity: high
    mitre: ["T1219"]
    tags: ["remote-access", "remote-utilities"]
    enabled: true

  # Port 5000: UPnP / Dev Servers
  - name: UPnP Dev Server Detected
    description: UPnP or dev server detected - UPnP can expose internal services
    type: TCP
    expression: DstPort == 5000 || SrcPort == 5000
    severity: medium
    mitre: ["T1021.001"]
    tags: ["exposure"]
    enabled: true

  # Port 5060-5061: SIP (VoIP)
  - name: SIP Detected
    description: SIP detected (VoIP plaintext) - toll fraud and call interception risk
    type: TCP
    expression: DstPort == 5060 || SrcPort == 5060
    severity: medium
    mitre: ["T1499"]
    tags: ["voip", "cleartext"]
    enabled: true

  - name: SIPS Detected
    description: SIP over TLS detected - prefer encrypted signaling for VoIP
    type: TCP
    expression: DstPort == 5061 || SrcPort == 5061
    severity: medium
    mitre: ["T1499"]
    tags: ["voip", "encrypted"]
    enabled: true

  # Port 8080: HTTP Alternate
  - name: HTTP Alternate 8080 Detected
    description: Alternate HTTP or app dev endpoint detected - unmanaged apps often run here
    type: TCP
    expression: DstPort == 8080 || SrcPort == 8080
    severity: medium
    mitre: ["T1071.001", "T1190"]
    tags: ["alternate-port"]
    enabled: true

  # Port 3000: Next.js
  - name: Next.js Detected
    description: Next.js HTTP dev endpoint detected - unmanaged apps often run here
    type: TCP
    expression: DstPort == 3000 || SrcPort == 3000
    severity: medium
    mitre: ["T1071.001", "T1190"]
    tags: ["alternate-port"]
    enabled: true

  # Port 8443: HTTPS Alternate
  - name: HTTPS Alternate 8443 Detected
    description: Alternate HTTPS or admin console detected - restrict and monitor
    type: TCP
    expression: DstPort == 8443 || SrcPort == 8443
    severity: medium
    mitre: ["T1071.001"]
    tags: ["admin-panel"]
    enabled: true

  # Port 8888: HTTP Alternate
  - name: HTTP Alternate 8888 Detected
    description: Alternate HTTP port detected - commonly used for proxies, dev servers, and admin panels
    type: TCP
    expression: DstPort == 8888 || SrcPort == 8888
    severity: medium
    mitre: ["T1071.001", "T1090.001"]
    tags: ["alternate-port", "proxy"]
    enabled: true

  # Port 9000: Admin / Dev Panels
  - name: Admin Panel 9000 Detected
    description: Admin panel or dev interface detected - admin interfaces need strict access controls
    type: TCP
    expression: DstPort == 9000 || SrcPort == 9000
    severity: medium
    mitre: ["T1078.004"]
    tags: ["admin-panel"]
    enabled: true

  # Port 10000: Webmin
  - name: Webmin Detected
    description: Webmin or web admin panel detected - should be isolated and MFA-protected
    type: TCP
    expression: DstPort == 10000 || SrcPort == 10000
    severity: medium
    mitre: ["T1078.004"]
    tags: ["admin-panel"]
    enabled: true

  # ========================================
  # LOW RISK PORTS (Informational)
  # ========================================

  # Port 68: DHCP Client
  - name: DHCP Client Detected
    description: DHCP client responses detected - watch for unexpected servers
    type: TCP
    expression: DstPort == 68 || SrcPort == 68
    severity: info
    mitre: ["T1557.002"]
    tags: ["dhcp"]
    enabled: true

  # Port 119: NNTP
  - name: NNTP Detected
    description: Network News Transfer Protocol detected - rare but can be abused for spam
    type: TCP
    expression: DstPort == 119 || SrcPort == 119
    severity: low
    mitre: ["T1071.001"]
    tags: ["legacy"]
    enabled: true

  # Port 520: RIP
  - name: RIP Detected
    description: Routing Information Protocol detected (legacy) - routing protocol spoofing risk
    type: TCP
    expression: DstPort == 520 || SrcPort == 520
    severity: low
    mitre: ["T1557.002"]
    tags: ["routing", "legacy"]
    enabled: true

  # Port 25565: Minecraft
  - name: Minecraft Server Detected
    description: Minecraft game server detected - can leak user data or be used in DDoS
    type: TCP
    expression: DstPort == 25565 || SrcPort == 25565
    severity: info
    mitre: ["T1499"]
    tags: ["gaming"]
    enabled: true

  # ========================================
  # EXTERNAL CONNECTION MONITORING
  # (High-risk ports to external IPs)
  # ========================================

  - name: SMB External Connection
    description: SMB connection to external IP detected - critical ransomware vector
    type: TCP
    expression: (DstPort == 445 || DstPort == 139) && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1021.002", "T1486"]
    tags: ["external", "ransomware"]
    enabled: true

  - name: RDP External Connection
    description: RDP connection to external IP detected - potential compromise or exfiltration
    type: TCP
    expression: DstPort == 3389 && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1021.001"]
    tags: ["external"]
    enabled: true

  - name: Database External Connection
    description: Database connection to external IP detected (MySQL/MSSQL/Oracle/MongoDB) - data breach risk
    type: TCP
    expression: (DstPort == 3306 || DstPort == 1433 || DstPort == 1521 || DstPort == 27017) && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1041", "T1567.002"]
    tags: ["external"]
    enabled: true

  - name: Redis External Connection
    description: Redis connection to external IP detected - potential data exfiltration
    type: TCP
    expression: DstPort == 6379 && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1041"]
    tags: ["external"]
    enabled: true

  - name: VNC External Connection
    description: VNC connection to external IP detected - remote control risk
    type: TCP
    expression: DstPort == 5900 && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1021.005"]
    tags: ["external"]
    enabled: true

  - name: Telnet External Connection
    description: Telnet connection to external IP detected - cleartext legacy protocol
    type: TCP
    expression: DstPort == 23 && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1021.004"]
    tags: ["external", "cleartext"]
    enabled: true

  - name: RDP Gateway External Connection
    description: RDP Gateway connection to external IP detected (RD Web Access or RDP over UDP)
    type: TCP
    expression: (DstPort == 5504 || DstPort == 3391) && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1021.001"]
    tags: ["external", "remote-desktop"]
    enabled: true

  - name: Remote Utilities External Connection
    description: Remote Utilities connection to external IP detected - unauthorized remote access risk
    type: TCP
    expression: (DstPort == 5650 || DstPort == 5655) && IsPublicIP(DstIP)
    severity: critical
    mitre: ["T1219"]
    tags: ["external", "remote-access"]
    enabled: true

  - name: SSH Alternate External Connection
    description: SSH on alternate port (22022) to external IP detected - monitor for data exfiltration
    type: TCP
    expression: DstPort == 22022 && IsPublicIP(DstIP)
