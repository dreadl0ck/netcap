# default language
language: bash

# globals for all commands
globals:
    # NETCAP version
    VERSION: 0.8.1

# command data
commands:
    
    ## Install all
    ##

    ## linker flags
    #   -w	disable DWARF generation
    #   -s	disable symbol table
    install:
        description: install net tool to $PATH
        buildNumber: true
        help: Compiles and moves the netcap binary to /usr/local/bin (auto-detects DPI libraries on macOS)
        exec: |
            # Extract gopacket version from go.mod
            GOPACKET_VERSION=$(grep "github.com/gopacket/gopacket" go.mod | grep -v indirect | awk '{print $2}')
            
            # Detect OS and handle DPI libraries automatically
            if [[ "$OSTYPE" == "darwin"* ]]; then
                # macOS - check for DPI libraries
                if command -v brew &>/dev/null && brew list ndpi &>/dev/null && brew list libprotoident &>/dev/null; then
                    # Detect versions
                    NDPI_VERSION=$(brew list --versions ndpi 2>/dev/null | awk '{print $2}')
                    LPI_VERSION=$(brew list --versions libprotoident 2>/dev/null | awk '{print $2}')
                    # Extract go-dpi version from go.mod
                    GO_DPI_VERSION=$(grep "github.com/dreadl0ck/go-dpi" go.mod | grep -v indirect | awk '{print $2}')
                    echo "[INFO] Building with DPI support (nDPI ${NDPI_VERSION}, libprotoident ${LPI_VERSION}, go-dpi ${GO_DPI_VERSION})"
                    # go-dpi v1.1.0+ already includes the correct CGO directives for Homebrew
                    go build -ldflags "-s -w \
                        -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION} \
                        -X github.com/dreadl0ck/netcap/dpi.NDPIVersion=${NDPI_VERSION} \
                        -X github.com/dreadl0ck/netcap/dpi.LibprotoidentVersion=${LPI_VERSION} \
                        -X github.com/dreadl0ck/netcap/dpi.GoDPIVersion=${GO_DPI_VERSION}" \
                        -o /usr/local/bin/net github.com/dreadl0ck/netcap/cmd
                else
                    echo "[INFO] Building without DPI support (install with: brew install ndpi libprotoident)"
                    go build -tags nodpi -ldflags "-s -w \
                        -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION}" \
                        -o /usr/local/bin/net github.com/dreadl0ck/netcap/cmd
                fi
            else
                # Linux or other - use default build
                go build -ldflags "-s -w \
                    -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION}" \
                    -o /usr/local/bin/net github.com/dreadl0ck/netcap/cmd
            fi

    install-linux:
        description: install netcap tool to $PATH on a linux system
        buildNumber: true
        help: |
            Compiles and moves the netcap binary to /usr/local/bin.
            Additionally, the cap_net_raw and cap_net_admin capabilities are set,
            to allow the NETCAP process to attach to a network interface.
        exec: |
            mkdir -p bin
            # Extract gopacket version from go.mod
            GOPACKET_VERSION=$(grep "github.com/gopacket/gopacket" go.mod | grep -v indirect | awk '{print $2}')
            
            # Try to detect DPI library versions on Linux
            LDFLAGS="-s -w"
            if [ -n "$GOPACKET_VERSION" ]; then
                LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION}"
            fi
            if ldconfig -p 2>/dev/null | grep -q libndpi; then
                # Attempt to extract version from pkg-config or library files
                if command -v pkg-config &>/dev/null && pkg-config --exists libndpi 2>/dev/null; then
                    NDPI_VERSION=$(pkg-config --modversion libndpi 2>/dev/null || echo "unknown")
                    LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap/dpi.NDPIVersion=${NDPI_VERSION}"
                fi
                if command -v pkg-config &>/dev/null && pkg-config --exists libprotoident 2>/dev/null; then
                    LPI_VERSION=$(pkg-config --modversion libprotoident 2>/dev/null || echo "unknown")
                    LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap/dpi.LibprotoidentVersion=${LPI_VERSION}"
                fi
                # Extract go-dpi version from go.mod
                GO_DPI_VERSION=$(grep "github.com/dreadl0ck/go-dpi" go.mod | grep -v indirect | awk '{print $2}')
                if [ -n "$GO_DPI_VERSION" ]; then
                    LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap/dpi.GoDPIVersion=${GO_DPI_VERSION}"
                fi
                echo "[INFO] Building with DPI support"
            fi
            go build -ldflags "$LDFLAGS" -o bin/net github.com/dreadl0ck/netcap/cmd
            echo "setting capabilities for attaching to a network interface and moving binary to /usr/local/bin (requires root)..."
            sudo mv bin/net /usr/local/bin
            sudo setcap cap_net_raw,cap_net_admin=eip $(which net)

    install-linux-nodpi:
        description: install netcap and netlabel on linux without DPI support
        help: |
            Compiles and moves the netcap binary to /usr/local/bin.
            Additionally, the cap_net_raw and cap_net_admin capabilities are set,
            to allow the NETCAP process to attach to a network interface.
        exec: |
            mkdir -p bin
            # Extract gopacket version from go.mod
            GOPACKET_VERSION=$(grep "github.com/gopacket/gopacket" go.mod | grep -v indirect | awk '{print $2}')
            LDFLAGS="-s -w"
            if [ -n "$GOPACKET_VERSION" ]; then
                LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION}"
            fi
            go build -tags nodpi -ldflags "$LDFLAGS" -o bin/net github.com/dreadl0ck/netcap/cmd
            echo "setting capabilities for attaching to a network interface and moving binary to /usr/local/bin (requires root)..."
            sudo mv bin/net /usr/local/bin
            sudo setcap cap_net_raw,cap_net_admin=eip $(which net)

    install-nodpi:
        description: install netcap and netlabel to $PATH
        buildNumber: true
        help: Compiles and moves the netcap binary to /usr/local/bin
        exec: |
            # Extract gopacket version from go.mod
            GOPACKET_VERSION=$(grep "github.com/gopacket/gopacket" go.mod | grep -v indirect | awk '{print $2}')
            LDFLAGS="-s -w"
            if [ -n "$GOPACKET_VERSION" ]; then
                LDFLAGS="$LDFLAGS -X github.com/dreadl0ck/netcap.GopacketVersion=${GOPACKET_VERSION}"
            fi
            go build -tags nodpi -ldflags "$LDFLAGS" -o /usr/local/bin/net github.com/dreadl0ck/netcap/cmd

    ## Debug Builds
    ##

    install-race:
        description: install a netcap build with race detection enabled
        buildNumber: true
        help: Install the race build to the default system location
        exec: GO111MODULE=on go build -tags nodpi -ldflags "-s -w -X github.com/dreadl0ck/netcap.Version=v${VERSION}-race" -race -o /usr/local/bin/net github.com/dreadl0ck/netcap/cmd

    ## Containers
    ##
    # deprecated - use build-linux or build-linux-nodpi

#    build-alpine-docker:
#        description: build all framework binaries for linux inside an apline docker container
#        help: used to compile for linux on macOS because cross compilation is a pain with CGO
#        dependencies:
#            - clean
#
#    build-ubuntu-docker:
#        description: build all framework binaries for linux inside an ubuntu docker container
#        help: used to compile for linux on macOS because cross compilation is a pain with CGO
#        dependencies:
#            - clean

    build-ubuntu-nodpi:
        exec: NODPI=true ARGS="--build-arg TAGS=-tags=nodpi" VERSION=nodpi_v${VERSION} zeus/scripts/build-ubuntu-docker.sh

    build-dbs-server:
        description: build and push the netcap database server container
        dependencies:
            - build-frontend
        arguments:
            - push:Bool? = true
        help: |
            Builds the netcap-dbs-server container and optionally pushes to a registry.
            Supports multi-platform builds (amd64 and arm64) using Docker Buildx.
            
            Environment Variables:
              NETCAP_CONTAINER_REGISTRY       - Registry URL (default: docker.io)
              NETCAP_CONTAINER_REGISTRY_USER  - Registry username (default: dreadl0ck)
              NETCAP_PUSH_IMAGES              - Set to 'true' to push after build
              NETCAP_USE_BUILDX               - Use buildx for multi-platform (default: true)
              NETCAP_PLATFORMS                - Target platforms (default: linux/amd64,linux/arm64)
              VERSION                         - Image version tag (default: from globals)
            
            Examples:
              # Build only (local, single platform)
              zeus build-dbs-server
              
              # Build and push multi-platform to Docker Hub
              NETCAP_PUSH_IMAGES=true zeus build-dbs-server
              
              # Build and push to custom registry
              NETCAP_CONTAINER_REGISTRY=registry.example.com \
              NETCAP_CONTAINER_REGISTRY_USER=myorg \
              NETCAP_PUSH_IMAGES=true \
              zeus build-dbs-server
              
              # Build single platform only
              NETCAP_USE_BUILDX=false NETCAP_PUSH_IMAGES=true zeus build-dbs-server
        exec: VERSION=${VERSION} NETCAP_PUSH_IMAGES=${push} zeus/scripts/build-dbs-server.sh

    build-service:
        description: build and push the netcap service mode container
        dependencies:
            - build-frontend
        arguments:
            - push:Bool? = true
        help: |
            Builds the netcap service mode container with webUI and optionally pushes to a registry.
            Supports multi-platform builds (amd64 and arm64) using Docker Buildx.
            
            The service runs using: net capture --service
            
            Environment Variables:
              NETCAP_CONTAINER_REGISTRY       - Registry URL (default: docker.io)
              NETCAP_CONTAINER_REGISTRY_USER  - Registry username (default: dreadl0ck)
              NETCAP_PUSH_IMAGES              - Set to 'true' to push after build
              NETCAP_USE_BUILDX               - Use buildx for multi-platform (default: true)
              NETCAP_PLATFORMS                - Target platforms (default: linux/amd64,linux/arm64)
              VERSION                         - Image version tag (default: from globals)
            
            Examples:
              # Build only (local, single platform)
              zeus build-service
              
              # Build and push multi-platform to Docker Hub
              NETCAP_PUSH_IMAGES=true zeus build-service
              
              # Build and push to custom registry
              NETCAP_CONTAINER_REGISTRY=registry.example.com \
              NETCAP_CONTAINER_REGISTRY_USER=myorg \
              NETCAP_PUSH_IMAGES=true \
              zeus build-service
              
              # Build specific version
              VERSION=v0.7.7 NETCAP_PUSH_IMAGES=true zeus build-service
        exec: VERSION=${VERSION} NETCAP_PUSH_IMAGES=${push} zeus/scripts/build-service.sh

    build-service-local-dpi:
        description: build and push the netcap service mode container with local go-dpi
        dependencies:
            - build-frontend
        arguments:
            - push:Bool? = true
        help: |
            Builds the netcap service mode container with a local version of go-dpi instead of the pinned version.
            Uses a replace directive in go.mod and copies the local go-dpi folder into the build container.
            Supports multi-platform builds (amd64 and arm64) using Docker Buildx.
            
            The service runs using: net capture --service
            
            Environment Variables:
              NETCAP_CONTAINER_REGISTRY       - Registry URL (default: docker.io)
              NETCAP_CONTAINER_REGISTRY_USER  - Registry username (default: dreadl0ck)
              NETCAP_PUSH_IMAGES              - Set to 'true' to push after build
              NETCAP_USE_BUILDX               - Use buildx for multi-platform (default: true)
              NETCAP_PLATFORMS                - Target platforms (default: linux/amd64,linux/arm64)
              VERSION                         - Image version tag (default: from globals)
              GO_DPI_PATH                     - Path to local go-dpi directory (default: ../go-dpi)
            
            Examples:
              # Build only (local, single platform) with default ../go-dpi path
              zeus build-service-local-dpi
              
              # Build with custom go-dpi path
              GO_DPI_PATH=/path/to/go-dpi zeus build-service-local-dpi
              
              # Build and push multi-platform to Docker Hub
              NETCAP_PUSH_IMAGES=true zeus build-service-local-dpi
              
              # Build specific version
              VERSION=v0.7.7 NETCAP_PUSH_IMAGES=true zeus build-service-local-dpi
        exec: VERSION=${VERSION} NETCAP_PUSH_IMAGES=${push} zeus/scripts/build-service-local-dpi.sh

    run-service:
        description: start the netcap service locally for testing
        dependencies:
            - build-frontend
            - install
        exec: |
            cd pcaps
            sleep 3 && open http://localhost:8080 &
            net capture -dpi -service -read *

    run-service-container:
        description: run the netcap service mode container locally for testing
        help: |
            Runs the netcap-service Docker container locally for testing.
            This command will:
              - Pull the latest image from the registry
              - Stop and remove any existing container with the same name
              - Create and start a fresh container with the latest image
            
            Data is persisted in a volume, so previous session data is preserved.
            
            Environment Variables:
              VERSION                         - Container image version (default: latest)
              CONTAINER_NAME                  - Custom container name (default: netcap-service-local)
              HTTP_PORT                       - Port to expose (default: 7070)
              DATA_DIR                        - Data directory for persistence (default: ~/.netcap/service-data)
              NC_DPI                          - Enable DPI support (default: true)
              NC_MAX_FILE_SIZE                - Max upload file size in bytes (default: 104857600 = 100MB)
              NC_MAX_ANALYSIS_HOUR            - Max analyses per hour per IP (default: 10)
              NC_SESSION_EXPIRY               - Session expiry in minutes (default: 60)
              NC_CLEANUP_INTERVAL             - Cleanup interval in minutes (default: 10)
              OPEN_BROWSER                    - Auto-open browser (default: false)
              FOLLOW_LOGS                     - Follow container logs after start (default: false)
              NETCAP_CONTAINER_REGISTRY       - Registry URL (default: docker.io)
              NETCAP_CONTAINER_REGISTRY_USER  - Registry username (default: dreadl0ck)
            
            Examples:
              # Run with default settings
              zeus run-service-container
              
              # Run on custom port
              HTTP_PORT=8080 zeus run-service-container
              
              # Run and open browser
              OPEN_BROWSER=true zeus run-service-container
              
              # Run and follow logs
              FOLLOW_LOGS=true zeus run-service-container
              
              # Run specific version
              VERSION=v0.7.7 zeus run-service-container
              
            Management:
              Stop:    docker stop netcap-service-local
              Start:   docker start netcap-service-local
              Remove:  docker rm netcap-service-local
              Logs:    docker logs -f netcap-service-local
        exec: zeus/scripts/run-service-container.sh

    run-ui:
        description: start the netcap service locally for testing
        dependencies:
            - build-frontend
            - install
        exec: |
            cd pcaps
            #sleep 6 && open http://localhost:8080 &
            #sudo net capture -iface en0 -out livecapture/

            # lsof -ti:8080 | xargs kill -9
            sleep 2 && open http://localhost:8080 &
            net capture -y -debug


    pack-dbs-tarball:
        description: pack databases into versioned tarball for dbs-server with metadata and symlinks
        help: |
            Creates a versioned tarball of netcap databases with metadata JSON and latest symlinks.
            Useful for distributing databases or mounting to dbs-server.
            
            The script creates:
            - YYYY-MM-DD.tar.gz  - Versioned database tarball
            - YYYY-MM-DD.json    - Metadata with version, size, and creation info
            - latest.tar.gz      - Symlink/copy to latest version
            - latest.json        - Symlink/copy to latest metadata
            
            Arguments:
              -d, --dbs-dir PATH      Path to databases directory (default: ~/.config/netcap/dbs)
              -o, --output-dir PATH   Output directory for tarball (default: current dir)
              -v, --version DATE      Version string (default: current date YYYY-MM-DD)
              -s, --start-year YEAR   NVD start year for metadata (default: 2002)
            
            Environment Variables:
              NC_CONFIG_ROOT  - Override default databases location if -d not specified
              DBS_VERSION     - Default version if -v not specified (format: YYYY-MM-DD)
            
            Examples:
              # Pack databases from default location (~/.config/netcap/dbs)
              zeus pack-dbs-tarball
              
              # Pack with custom output directory
              zeus pack-dbs-tarball -o ./release
              
              # Pack from custom directory with custom version
              zeus pack-dbs-tarball -d ./netcap-dbs -v 2024-01-15
              
              # Use environment variables with custom version
              DBS_VERSION=2024-01-15 zeus pack-dbs-tarball
        exec: zeus/scripts/pack-dbs.sh

    ## Release
    ##

    remove-dist:
        exec: rm -rf dist; rm -rf dist-linux

    # run a prod release
    release:
        stopOnError: true
        description: release a new version, bundle and publish on github
        dependencies:
            - remove-dist
            - gen-version
            - version-bump
            - check-version
            - gen-proto-release
            - build-linux
            - build-linux-nodpi
            - run-goreleaser
            - update-release-assets
        exec: echo "release v$VERSION done"

    run-goreleaser:
        exec: goreleaser check && goreleaser release --skip-validate

    update-release-assets:
        exec: |
            # upload linux build archives
            for f in dist-linux/*.tar.gz; do
                gh release upload --clobber v$VERSION $f
            done

            cd dist
            # add nodpi darwin build - the build with dpi libs will be used untouched
            # Note: goreleaser builds for darwin/arm64 only
            if [ -d "netcap_macOS_nodpi_darwin_arm64" ]; then
                tar -czvf netcap-nodpi-v${VERSION}-darwin-arm64.tar.gz netcap_macOS_nodpi_darwin_arm64
                # upload nodpi darwin build to release
                gh release upload --clobber v$VERSION netcap-nodpi-v${VERSION}-darwin-arm64.tar.gz
                # update checksums file with hashes for darwin build
                shasum -a 256 netcap-nodpi-v${VERSION}-darwin-arm64.tar.gz >> ../dist-linux/checksums.txt
            fi
            
            # Add checksums for the regular darwin build if it exists
            if [ -f "netcap-v${VERSION}-darwin-arm64.tar.gz" ]; then
                shasum -a 256 netcap-v${VERSION}-darwin-arm64.tar.gz >> ../dist-linux/checksums.txt
            fi
            cd ..

            # append hash of windows build to final checksum file
            grep windows dist/checksums.txt >> dist-linux/checksums.txt

            # sync updated checksums file
            gh release upload --clobber v$VERSION dist-linux/checksums.txt

    # run a test release
    release-test:
        description: test run to release a new version
        dependencies:
            - gen-version
            - version-bump-test
            - gen-proto-release
        exec: goreleaser check && goreleaser release --clean --skip-publish --skip-validate; zeus version-bump-test-undo

    # run a test release
    release-test-debug:
        description: test run to release a new version with debug mode
        dependencies:
            - gen-version
            - version-bump-test
            - gen-proto-release
        exec: goreleaser check && goreleaser release --clean --skip-publish --skip-validate --debug; zeus version-bump-test-undo

    release-test-full:
         dependencies:
            - release-test
            - build-linux
            - build-linux-nodpi
         exec: open dist

    pack-dist:
        exec: |
            cp maltego/netcap.mtz dist/
            cp resolvers/resolver-dbs.zip dist/
            cp /usr/local/etc/netcap/livecapture.conf dist/

    pack-dist-dev:
        exec: |
            cp maltego/netcap.mtz dist/
            cp resolvers/resolver-dbs.zip dist/
            cp /usr/local/etc/netcap/livecapture.conf dist/
            #cp -r /usr/local/etc/netcap/exploits dist/
            cp /usr/local/etc/netcap/dbs/hosts dist/
            cp /usr/local/etc/netcap/dbs/*.mmdb dist/
            cp /usr/local/etc/netcap/fingerprint_api_key dist/

    ## Frontend
    ##

    build-frontend:
        description: build the web UI frontend
        help: |
            Builds the Next.js frontend for the web UI and generates static files
            that are embedded into the Go binary.
            
            Requirements:
              - Node.js 18+ and npm must be installed
            
            The build output will be placed in:
              cmd/capture/webui/frontend/out/
            
            Both capture (standard and service mode) use the frontend from this location.
            
            This command is automatically run as part of the release process,
            but can be run manually when developing the web UI.
            
            Examples:
              # Build frontend
              zeus build-frontend
              
              # Build frontend and install netcap
              zeus build-frontend && zeus install
        exec: |
            cd cmd/capture/webui/frontend
            echo "[INFO] Installing frontend dependencies..."
            npm install
            echo "[INFO] Building frontend..."
            npm run build
            echo "[INFO] Frontend build complete!"
            echo "[INFO] Static files are in: cmd/capture/webui/frontend/out/"
            echo "[INFO] Run 'zeus install' to rebuild netcap with the new frontend"

    ## Utils
    ##

    procs:
        description: show running netcap processes on this machine
        exec: |
            watch "ps ax | grep /usr/local/bin/net --color | grep -v watch | grep -v grep"

    clean:
        description: clean project
        exec: |
            rm -rf bin/*
            rm -f *.ncap *.pcap *.ncap.gz *.log

    clean-docker:
        description: docker system prune --volumes
        exec: docker system prune --volumes

    # count lines of code
    cloc:
        description: count lines of code for the project
        exec: |
            cloc . \
                --exclude-ext=pb.go \
                --exclude-dir=types/python,types/java,types/swift,types/rust,types/cpp,types/csharp,types/js \
                --exclude-dir=cmd/capture/webui/frontend/out,cmd/capture/webui/frontend/.next,cmd/capture/webui/frontend/node_modules \
                --exclude-dir=dist,dist-linux \
                --exclude-dir=pcaps,tests,test-output,test-params,data \
                --exclude-dir=bin,FlameGraph \
                --exclude-dir=node_modules,.git

    # generate protocol buffers for development
    gen-proto-dev:
        description: generate protocol buffers
        help: proto compiler must be installed with gogofaster plugin
        exec: protoc --gogofaster_out=types/. netcap.proto

    # generate protocol buffers for release
    gen-proto-release:
        description: generate protocol buffers
        help: proto compiler must be installed with all required plugins
        exec: |
            mkdir -p types/{python,java,swift,rust,cpp,csharp,js}
            #protoc --gogofaster_out=types/. --python_out=types/python --java_out=types/java --swift_out=types/swift --rust_out=types/rust --cpp_out=types/cpp --csharp_out=types/csharp --js_out=types/js netcap.proto
            protoc --gogofaster_out=types/. --python_out=types/python --java_out=types/java --swift_out=types/swift --cpp_out=types/cpp --csharp_out=types/csharp --js_out=types/js netcap.proto

    # the version defined in the globals section will be set via ldflags on each build
    # to ensure the correct version is also set for installation via go get
    # a version.go file is generated on each release with the corresponding version number
    gen-version:
        description: set the correct project version
        help: generates the version.go file
        exec: |
            echo "[INFO] configuring core for version v$VERSION"
            
            # Extract dependency versions from go.mod
            GOPACKET_VERSION=$(grep "github.com/gopacket/gopacket" go.mod | grep -v indirect | awk '{print $2}')
            GO_DPI_VERSION=$(grep "github.com/dreadl0ck/go-dpi" go.mod | grep -v indirect | awk '{print $2}')
            
            # Generate version.go with all version info
            echo -e "// Package netcap is a framework for network traffic analysis. Learn more at https://netcap.io.\npackage netcap\n\n// Version is the current version identifier for netcap.\nvar Version = \"v${VERSION}\"\n\n// Commit is the git commit id of the current version.\nvar Commit = \"$(git rev-parse HEAD | tr -d "\n")\"\n\n// GopacketVersion is the version of gopacket library used.\nvar GopacketVersion = \"$GOPACKET_VERSION\"" > version.go
            
            # Update Dockerfile version
            sed "s/.*ENV VERSION.*/ENV VERSION ${VERSION}/" Dockerfile > Dockerfile-cp
            mv Dockerfile-cp Dockerfile
            
            # Update go-dpi version in dpi/version.go
            echo "[INFO] updating go-dpi version in dpi/version.go"
            if [ -n "$GO_DPI_VERSION" ]; then
                echo "[INFO] found go-dpi version: $GO_DPI_VERSION"
                sed -i.bak "s/GoDPIVersion = \".*\"/GoDPIVersion = \"$GO_DPI_VERSION\"/" dpi/version.go
                rm -f dpi/version.go.bak
            else
                echo "[WARNING] could not extract go-dpi version from go.mod"
            fi
            
            echo "[INFO] found gopacket version: $GOPACKET_VERSION"

    # build base builder images for accelerated Linux builds
    build-builder-images:
        stopOnError: true
        arguments:
            - push:Bool? = true
        description: builds and optionally pushes base builder docker images that are reused for faster Linux builds
        exec: PUSH=${push} zeus/scripts/build-builder-images.sh

    # build and push the linux docker containers
    build-linux:
        description: builds the alpine and ubuntu docker containers
        exec: VERSION=${VERSION} zeus/scripts/build-linux.sh

    # build and push the linux docker containers without dpi support
    build-linux-nodpi:
        description: builds the alpine and ubuntu docker containers without dpi support
        exec: VERSION=${VERSION} zeus/scripts/build-linux-nodpi.sh

    # build windows
    build-windows:
        description: builds the windows executables
        exec: GOOS=windows GOARCH=amd64 go build -tags="nodpi" -o bin/net.exe github.com/dreadl0ck/netcap/cmd

    # check git version
    check-version:
        description: checks whether the version from the latest git tag matches the one set here
        exec: |
            if [[ $(git describe --abbrev=0) != "v${VERSION}" ]]; then
                echo "[ERROR] latest git tag does not match version $VERSION"
                exit 1
            fi

    # bump the git version tag
    version-bump:
        description: bump framework version and add git version tag
        exec: |
            read -p "[WARNING] This will bump the version to $VERSION, as configured in the zeus/commands.yml. Are you sure? Hit [Enter] to proceed"

            git status
            read -p "[WARNING] The following changes will be added to version control. Hit [Enter] to proceed"
            git add .
            git commit -m "v${VERSION} release"

            git tag -a v${VERSION} -m "v${VERSION} release"
            git push origin v${VERSION}

            echo "[INFO] version bumped to v${VERSION}"

    # bump the git version tag
    version-bump-test:
        description: bump framework version and add git version tag
        exec: |
            git tag -a v${VERSION} -m "v${VERSION} release test"
            echo "[INFO] added test tag v${VERSION}"

    # bump the git version tag
    version-bump-test-undo:
        description: bump framework version and add git version tag
        exec: |
            git tag -d v${VERSION}
            echo "[INFO] removed test tag v${VERSION}"
    
    static-analyze:
        description: run the golangci-lint static source code analyzer
        exec: golangci-lint run

    gosec-analyze:
        description: run the gosec static source code analyzer
        exec: gosec ./...

    delete-tag:
        description: delete tag locally and remotely
        arguments:
            - tag:String
        exec: |
            git tag -d $tag || true
            # try to delete remote tag as well
            git push --delete origin $tag || true

    download-test-pcaps:
        description: fetches the pcap files for the unit tests
        help: uses git, wget and 7za to download several test pcap files
        exec: |
            mkdir -p tests && cd tests
            wget https://weberblog.net/wp-content/uploads/2020/02/The-Ultimate-PCAP.7z
            7za x The-Ultimate-PCAP.7z
            git clone https://github.com/wireshark/wireshark
            gunzip wireshark/test/captures/*.gz
            git clone https://github.com/kbandla/pcaps
            git clone https://github.com/automayt/ICS-pcap
            mv tests/ICS-pcap/FINS\ \(OMRON\) tests/ICS-pcap/FINS-OMRON
            mv tests/ICS-pcap/ETHERNET_IP/digitalbond\ pcaps tests/ICS-pcap/ETHERNET_IP/digitalbond-pcaps
            mv tests/ICS-pcap/MODBUS/digitalbond\ pcaps tests/ICS-pcap/MODBUS/digitalbond-pcaps
            mv tests/ICS-pcap/DNP3/digitalbond\ pcaps tests/ICS-pcap/DNP3/digitalbond-pcaps
            git clone https://github.com/tatsui-geek/malware-traffic-analysis.net
            git clone https://github.com/rahard/pcapfiles.git
            git clone https://github.com/markofu/pcaps.git morepcaps
            rm -f morepcaps/PracticalPacketAnalysis/ppa-capture-files/http-fault-post.pcap
            git clone https://github.com/odedshimon/BruteShark

    test-pcaps:
        exec: |
            trap 'exit 0' INT
            redcolor()(set -o pipefail;"$@" 2>&1>&3|sed $'s,.*,\e[31m&\e[m,'>&2)3>&1
            for f in $(find tests -type f -name "*.pcap" -o -name "*.pcapng"); do
                if [[ -f "$f" ]]; then
                    echo "net capture -read "$f" -out "$f.net" -quiet -time -ignore-unknown"
                    redcolor net capture -read "$f" -out "$f.net" -quiet -time -ignore-unknown || :
                    if [[ -d "$f.net" ]]; then
                        rm -rf "$f.net"
                    fi
                fi
            done

    test-pcaps-dev:
        exec: |
            trap 'exit 0' INT
            for f in $(find tests -type f -name "*.pcap" -o -name "*.pcapng"); do
                if [[ -f "$f" ]]; then
                    echo "net capture -read "$f" -out "$f.net""
                    net capture -read "$f" -out "$f.net"
                    if [[ -d "$f.net" ]]; then
                        rm -rf "$f.net"
                    fi
                fi
            done

    merge-test-pcaps:
        exec: |
            rm -f tests/merged.pcapng
            while IFS= read -r line; do
                FILES+=("$line")
            done < <(find tests -type f -name "*.pcap" -o -name "*.pcapng" | sort)
            declare -p FILES
            mergecap -w tests/merged.pcapng "${FILES[@]}"
            du -h tests/merged.pcapng


    install-bash-completion:
        description: install the bash-completion for netcap on macOS
        exec: |
            mkdir -p /usr/local/etc/bash_completion.d
            cp cmd/net /usr/local/etc/bash_completion.d/net && . /usr/local/etc/bash_completion.d/net

    install-bash-completion-linux:
        description: install the bash-completion for netcap on linux
        exec: |
            mkdir -p /usr/share/bash-completion/completions/
            cp cmd/net /usr/share/bash-completion/completions/net && . /usr/share/bash-completion/completions/net

    run-grafana:
        description: start grafana service locally
        exec: grafana-server -config configs/grafana.ini --homepath /usr/local/opt/grafana/share/grafana

    run-prometheus:
        description: start prometheus daemon locally
        exec: prometheus --config.file configs/prometheus.yml

    download-vulndbs:
        description: download vulnerability databases
        exec: |
            # from https://github.com/scipag/vulscan
            mkdir vulnDBs
            cd vulnDBs
            wget https://www.computec.ch/projekte/vulscan/download/cve.csv
            wget https://www.computec.ch/projekte/vulscan/download/exploitdb.csv
            wget https://www.computec.ch/projekte/vulscan/download/openvas.csv
            wget https://www.computec.ch/projekte/vulscan/download/osvdb.csv
            wget https://www.computec.ch/projekte/vulscan/download/scipvuldb.csv
            wget https://www.computec.ch/projekte/vulscan/download/securityfocus.csv
            wget https://www.computec.ch/projekte/vulscan/download/securitytracker.csv
            wget https://www.computec.ch/projekte/vulscan/download/xforce.csv
            echo "done, downloaded:"
            du -h vulnDBs

    fix-maltego-permissions:
        description: fix the permissions for Java and Maltego on macOS
        help: Maltego requires certain paths to be owned by the current user, or the program will not start
        exec: |
            echo "changing ownership to the current user $USER, for system paths that are relevant to Maltego."
            sudo chown -R $USER /Library/Java/JavaVirtualMachines
            sudo chown -R $USER /Applications/Maltego.app
            sudo chown -R $USER "/Users/$USER/Library/Application Support/maltego"

    profile-io:
        exec: |
            if [[ ! -d FlameGraph ]]; then
                git clone https://github.com/brendangregg/FlameGraph
            fi
            cd FlameGraph && curl -s 'localhost:6060/debug/fgprof?seconds=3&format=folded' > fgprof.folded
            ./flamegraph.pl fgprof.folded > fgprof.svg
            open fgprof.svg

    profile-io-fprof:
        exec: |
            go tool pprof --http=:6061 http://localhost:6060/debug/fgprof?seconds=3 > fgprof.folded

    profile-io-pprof:
        exec: |
            go tool pprof --http=:6061 http://localhost:6060/debug/pprof?seconds=3 > fgprof.folded

    lint:
        exec: golangci-lint --timeout=10m run ./...

    gosec:
        exec: gosec ./...

    test:
        dependencies:
            - make-icons
        exec: |
            go clean -testcache && go test ./... -coverprofile cover.out
            go tool cover -html=cover.out

    test-race:
        dependencies:
            - make-icons
        exec: GORACE="history_size=7" go test -race ./...

    test-verbose:
        dependencies:
            - make-icons
        exec: go test -v ./...

    bench:
        dependencies:
            - make-icons
        exec: go test -v -bench=. ./...

    test-params:
        description: test various different configurations of the netcap core, to compare their performance and accuracy

    format-code:
        description: format source code
        exec: |

            # TODO: recursive ./... does not seem to be supported
            gofumpt -w *.go
            gofumpt -w ./*/*.go
            gofumpt -w ./*/*/*.go

            gofumports -w -v .

            gci -w -local github.com/dreadl0ck/netcap .

    format-proto:
        description: format protobuf definitions
        help: |
            https://github.com/uber/prototool#prototool-format
        exec: |
            prototool format -w -f netcap.proto

    make-icons:
        description: generate icons for maltego integration
        exec: |
            go clean -testcache && go test -v -run="GenerateAuditRecordIconsSVG" -tags="icons" github.com/dreadl0ck/netcap/maltego

    gen-maltego-config:
        dependencies:
          - make-icons
        exec: go test -v -run="TestGenerateFullMaltegoConfiguration" -tags="icons" github.com/dreadl0ck/netcap/maltego

    open-maltego-logs:
        exec: code "/Users/$USER/Library/Application Support/maltego/"

    export-windows-vm:
        description: export the windows VM
        exec: |
          cd /Applications/VMware\ Fusion.app/Contents/Library/VMware\ OVF\ Tool/
          ./ovftool --acceptAllEulas ~/Virtual\ Machines.localized/WinDev2008Eval.vmwarevm/WinDev2008Eval.vmx ~/Documents/Netcap_${VERSION}_Win10.ova
          du -sh ~/Documents/Netcap_${VERSION}_Win10.ova

    export-ubuntu-vm:
        description: export the ubuntu VM
        exec: |
            cd /Applications/VMware\ Fusion.app/Contents/Library/VMware\ OVF\ Tool/
            ./ovftool --acceptAllEulas ~/Virtual\ Machines.localized/NETCAP\ Ubuntu\ 64-bit\ 20.04.1.vmwarevm/NETCAP\ Ubuntu\ 64-bit\ 20.04.1.vmx ~/Documents/Netcap_${VERSION}_Ubuntu.ova
            du -sh ~/Documents/Netcap_${VERSION}_Ubuntu.ova

    export-kali-vm:
        description: export the kali VM
        exec: |
            cd /Applications/VMware\ Fusion.app/Contents/Library/VMware\ OVF\ Tool/
            ./ovftool --acceptAllEulas ~/Virtual\ Machines.localized/NETCAP\ Kali\ Linux.vmwarevm/NETCAP\ Kali\ Linux.vmx ~/Documents/Netcap_${VERSION}_Kali_Linux.ova
            du -sh ~/Documents/Netcap_${VERSION}_Kali_Linux.ova

    install-debian:
        description: build script to compile DPI dependencies and netcap on debian linux

    publish-module:
        description: publish the latest version as go module
        help: see https://golang.org/doc/modules/publishing
        exec: GOPROXY=proxy.golang.org go list -m github.com/dreadl0ck/netcap@${VERSION}

    download-geolite:
        description: download the last maxmind geolite version that has been distributed under the creative commons licencse
        exec: |
            mkdir -p dist/geolite
            cd dist/geolite

            if [ ! -f GeoLite2-City_20191224/GeoLite2-City.mmdb ]; then
                echo "downloading GeoLite2-City.tar.gz"
                wget -q https://web.archive.org/web/20191227182209if_/https://geolite.maxmind.com/download/geoip/database/GeoLite2-City.tar.gz
                tar xzf GeoLite2-City.tar.gz
            else
                echo "GeoLite2-City_20191224/GeoLite2-City.mmdb already downloaded"
            fi

            if [ ! -f GeoLite2-ASN_20192124/GeoLite2-ASN.mmdb ]; then
                echo "downloading GeoLite2-ASN.tar.gz"
                wget -q https://web.archive.org/web/20191227182527if_/https://geolite.maxmind.com/download/geoip/database/GeoLite2-ASN.tar.gz
                tar xzf GeoLite2-ASN.tar.gz
            else
                echo "GeoLite2-ASN_20191224/GeoLite2-ASN.mmdb already downloaded"
            fi

    callvis:
        description: generate callvis graphics
        help: go get -u github.com/ofabry/go-callvis
        exec: |
            mkdir -p graphics/callvis
            go-callvis -format=svg -file=graphics/callvis/cmd -focus main -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/collector -focus collector -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/label -focus github.com/dreadl0ck/netcap/label -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/decoder -focus decoder -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/packet -focus packet -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/stream -focus stream -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/maltego -focus maltego -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/reassembly -focus reassembly -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/resolvers -focus resolvers -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/io -focus github.com/dreadl0ck/netcap/io -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/utils -focus github.com/dreadl0ck/netcap/utils -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/types -focus types -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/dbs -focus dbs -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/dpi -focus dpi -nostd ./...
            go-callvis -format=svg -file=graphics/callvis/core -focus core -nostd ./...

    kill:
        description: kill leftover processes
        exec: |
            lsof -ti:8080 | xargs kill -9

    copy-rules:
        description: copy the rules to the rules folder
        exec: |
            cp rules/examples/* ~/.local/share/netcap-service/rules
            scp rules/examples/* $DEPLOY_USER@$DEPLOY_HOST:/mnt/storage/netcap-try-server/data/netcap-service/rules