x-runtime: &runtime
  image: ${FIREWALL_IMAGE:-netcap-firewall:0.1.0-local}
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 1
  pids_limit: 64
  tmpfs: ['/tmp:size=256m,mode=1777,noexec,nosuid,nodev']
  stop_grace_period: 60s
  networks: [control]
services:
  fleet:
    <<: *runtime
    env_file: ['${LAB_ENV_DIR:?generated credentials directory required}/fleet.env']
    command: [fleet-controller, --config, /lab/fleet.json, --listen, ':9092', --tls-cert, /lab/tls.crt, --tls-key, /lab/tls.key]
    healthcheck: {disable: true}
    ports: ['127.0.0.1:${FLEET_PORT:?}:9092']
    volumes:
      - '${LAB_CONFIG_DIR:?}:/lab:ro'
      - '${LAB_FLEET_STATE:?}:/state'
  state:
    <<: *runtime
    env_file: ['${LAB_ENV_DIR:?}/state.env']
    command: [sharedstate, --config, /lab/state.json, --listen, ':9092', --tls-cert, /lab/tls.crt, --tls-key, /lab/tls.key]
    healthcheck: {disable: true}
    volumes:
      - '${LAB_CONFIG_DIR:?}:/lab:ro'
      - '${LAB_COUNTER_STATE:?}:/state'
  waf1:
    <<: *runtime
    env_file: ['${LAB_ENV_DIR:?}/waf1.env']
    command: [serve, --config, /lab/waf.json, --fleet-agent-config, /lab/waf1.json, --shared-rate-config, /lab/rate.json]
    ports: ['127.0.0.1:${WAF1_PORT:?}:8080']
    volumes:
      - '${LAB_CONFIG_DIR:?}:/lab:ro'
      - '${LAB_WAF1_STATE:?}:/state'
    networks: [control, origin]
  waf2:
    <<: *runtime
    env_file: ['${LAB_ENV_DIR:?}/waf2.env']
    command: [serve, --config, /lab/waf.json, --fleet-agent-config, /lab/waf2.json, --shared-rate-config, /lab/rate.json]
    ports: ['127.0.0.1:${WAF2_PORT:?}:8080']
    volumes:
      - '${LAB_CONFIG_DIR:?}:/lab:ro'
      - '${LAB_WAF2_STATE:?}:/state'
    networks: [control, origin]
  backend:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777,noexec,nosuid,nodev']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [origin]
networks:
  control: {}
  origin: {internal: true}
