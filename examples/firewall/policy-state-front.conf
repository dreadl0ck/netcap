pid /tmp/nginx.pid;
events { worker_connections 128; }
stream {
    upstream authorities {
        server authority1:9092 max_fails=1 fail_timeout=1s;
        server authority2:9092 max_fails=1 fail_timeout=1s;
    }
    server {
        listen 9092;
        proxy_connect_timeout 500ms;
        proxy_timeout 30s;
        proxy_pass authorities;
    }
}
