pid /tmp/nginx.pid;
events { worker_connections 128; }
stream {
    upstream fleet_nodes {
        server fleet1:9092 max_fails=1 fail_timeout=1s;
        server fleet2:9092 max_fails=1 fail_timeout=1s;
    }
    upstream state_nodes {
        server state1:9092 max_fails=1 fail_timeout=1s;
        server state2:9092 max_fails=1 fail_timeout=1s;
    }
    server {
        listen 9092;
        proxy_connect_timeout 1s;
        proxy_timeout 30s;
        proxy_pass fleet_nodes;
    }
    server {
        listen 9093;
        proxy_connect_timeout 1s;
        proxy_timeout 30s;
        proxy_pass state_nodes;
    }
}
