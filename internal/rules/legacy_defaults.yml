    severity: critical
    mitre: ["T0814", "T0826"]
    tags: ["ics", "dos", "flooding", "availability"]
    enabled: true
    group_by: ["DstIP"]
    threshold: 1000
    threshold_window: 30
  - name: IRC Communication
    description: Detect IRC traffic that may be used for botnet C2
    type: TCP
    expression: DstPort == 6667 || DstPort == 6668 || DstPort == 6669 || DstPort == 7000
    severity: medium
    mitre: ["T1219"]
    tags: ["botnet"]
    enabled: true
  - name: Suspicious Port 31337
    description: Detect connections to port 31337, commonly used by backdoors
    type: TCP
    expression: DstPort == 31337
    severity: critical
    mitre: ["T1571"]
    tags: ["backdoor"]
    enabled: true
  - name: DNS Suspicious TLD
    description: Detect DNS queries to suspicious top-level domains
    type: DNS
    expression: len(Questions) > 0 && (MatchesPattern(Questions[0].Name, "\\.tk$") || MatchesPattern(Questions[0].Name, "\\.cc$") || MatchesPattern(Questions[0].Name, "\\.pw$"))
    severity: medium
    mitre: ["T1071.004"]
    tags: ["suspicious-tld"]
    enabled: true
  - name: Suspicious HTTP Beaconing
    description: Detect HTTP POST requests with minimal content that may be C2 beaconing
    type: HTTP
    expression: Method == "POST" && ReqContentLength < 100 && StatusCode == 200
    severity: low
    mitre: ["T1071.001"]
    tags: ["beaconing"]
    enabled: true
  - name: SOCKS Proxy Detection
    description: Detect connections to common SOCKS proxy ports
    type: TCP
    expression: DstPort == 1080 || DstPort == 9050
    severity: medium
    mitre: ["T1090"]
    tags: ["proxy"]
    enabled: true
  - name: Remote Access Tool Ports
    description: Detect connections to common RAT ports
    type: TCP
    expression: DstPort == 4444 || DstPort == 5555 || DstPort == 6666 || DstPort == 8088
    severity: critical
    mitre: ["T1219"]
    tags: ["rat"]
    enabled: true
  - name: SYN Scan Detection
    description: One source sends SYNs (without ACK or RST) to 100+ distinct destination ports within 60 seconds
    type: TCP
    expression: SYN && !ACK && !RST
    severity: info
    mitre: ["T1046"]
    tags: ["port-scan"]
    enabled: true
    distinct_field: DstPort
    distinct_threshold: 100
    threshold_window: 60
  - name: DHCP Traffic Detected
    description: "Detects DHCP traffic. NOTE: To detect a rogue DHCP server, this requires correlation to distinguish from known, legitimate DHCP servers."
    type: UDP
    expression: DstPort == 68 || DstPort == 67
    severity: info
    mitre: ["T1557.003"]
    tags: ["rogue-server"]
    enabled: true
  - name: WPAD Query Detection
    description: Detect WPAD (Web Proxy Auto-Discovery) queries
    type: DNS
    expression: len(Questions) > 0 && MatchesPattern(Questions[0].Name, "(?i)wpad")
    severity: low
    mitre: ["T1557"]
    tags: ["mitm"]
    enabled: true
  - name: RDP Connection
    description: Detect RDP connections that may indicate lateral movement
