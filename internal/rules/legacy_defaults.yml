    description: 'One source opens 50+ SSH connections to the same server within 120 seconds'
    type: TCP
    expression: DstPort == 22 && SYN && !ACK
    severity: high
    mitre: ["T1110.001", "T1021.004"]
    tags: ["brute-force"]
    enabled: true
    group_by: ["SrcIP", "DstIP"]
    threshold: 50
    threshold_window: 120
  - name: Kerberos Authentication Spike
    description: 'One host sends 100+ packets to Kerberos (port 88) within 120 seconds'
    type: TCP
    expression: DstPort == 88
    severity: info
    mitre: ["T1558.001", "T1558.003"]
    tags: ["lateral-movement"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 100
    threshold_window: 120
  - name: Multiple External Connections
    description: One host opens connections to 50+ distinct public IPs on non-web ports within 60 seconds
    type: TCP
    expression: IsPublicIP(DstIP) && SYN && !ACK && DstPort != 80 && DstPort != 443 && DstPort != 8080 && DstPort != 8443
    severity: info
    mitre: ["T1071"]
    tags: ["anomaly"]
    enabled: true
    distinct_field: DstIP
    distinct_threshold: 50
    threshold_window: 60
  - name: Empty User Agent Detected
    description: Detect missing or empty user agent string (suspicious for legitimate browsers)
    type: HTTP
    expression: UserAgent == ""
    severity: low
    mitre: ["T1071.001"]
    tags: ["suspicious-ua", "anomaly"]
    enabled: true
  - name: Suspiciously Short User Agent
    description: Detect unusually short user agent strings (< 10 chars) often used by tools
    type: HTTP
    expression: len(UserAgent) > 0 && len(UserAgent) < 10
    severity: low
    mitre: ["T1071.001"]
    tags: ["suspicious-ua", "anomaly"]
    enabled: true
  - name: Old HTTP Version
    description: Detect HTTP/1.0 usage (unusual for modern clients, common in scripts)
    type: HTTP
    expression: MatchesPattern(Proto, "HTTP/1\\.0")
    severity: low
    mitre: ["T1071.001"]
    tags: ["anomaly", "legacy"]
    enabled: true
  - name: Unusual HTTP Method
    description: Detect unusual HTTP methods that may indicate tunneling or scanning
    type: HTTP
    expression: Method != "GET" && Method != "POST" && Method != "HEAD" && Method != "PUT" && Method != "DELETE" && Method != "OPTIONS" && Method != "PATCH"
    severity: medium
    mitre: ["T1090", "T1572"]
    tags: ["tunneling"]
    enabled: true
