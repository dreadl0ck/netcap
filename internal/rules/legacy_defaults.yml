    description: Detect SMB connections that may indicate remote service execution (PsExec-style)
    type: TCP
    expression: DstPort == 445 && PSH && ACK
    severity: medium
    mitre: ["T1569.002"]
    tags: ["execution"]
    enabled: true
  - name: WMI Activity
    description: 'Remote WMI over DCOM: a client binds to or calls IWbemLevel1Login or IWbemServices'
