description: Passive evidence of SMB backdoor responses, web compromise, host check-ins and exposed onion destinations.
rules:
  - name: DoublePulsar Backdoor Response
    description: SMB1 response pattern consistent with DoublePulsar; corroborate with other evidence on the same host.
    type: SMB
    expression: 'Version == 1 && IsResponse && CommandName == "TRANSACTION2" && Status == 3221225474 && MessageID in [81, 82]'
    severity: high
    tags: [smb, backdoor]
    dedupe_by: [SrcIP, DstIP]
    dedupe_window: 300
    enabled: true
  - name: MS17-010 Probe Response
    description: SMB1 response consistent with a vulnerability probe; this alone does not prove exploitation.
    type: SMB
    expression: 'Version == 1 && IsResponse && CommandName == "TRANSACTION" && Status == 3221225989'
    severity: high
    tags: [smb, vulnerability-probe]
    dedupe_by: [SrcIP, DstIP]
    dedupe_window: 300
    enabled: true
  - name: Webshell Command Parameter
    description: A request to a script uses a command parameter containing shell-command syntax. Does not assert execution.
    type: HTTP
    expression: 'Method != "" && MatchesPattern(URL, "(?i)\\.(php|asp|aspx|jsp|cgi)\\?(?:[^#]*&)?(?:cmd|exec|command|execute|run)=(?:ls|cat|id|pwd|whoami|uname|wget|curl|nc|ncat|bash|sh|perl|python|powershell)(?:%20|\\+|[[:space:]&]|$)")'
    severity: high
    tags: [web, command-execution]
    enabled: true
  - name: Reverse Shell Indicator In HTTP Request
    description: A request contains reverse-shell indicators in its URL or decoded form values; an attempt does not prove compromise.
    type: HTTP
    expression: 'Method != "" && (MatchesPattern(URL, "(?i)(\\bnc(?:%20|\\+|[[:space:]])+-e(?:%20|\\+|[[:space:]])|/dev/tcp/)") || (Method == "POST" && ParamMatches(Parameters, "(?i)(?:\\bIO::Socket::INET\\b|/dev/tcp/)")))'
    severity: high
    tags: [web, reverse-shell]
    enabled: true
  - name: Indy Library HTTP Client
    description: An Indy Library client contacted a public endpoint; correlate with delivery or check-in evidence.
    type: HTTP
    expression: 'Method != "" && IsPublicIP(DstIP) && MatchesPattern(UserAgent, "(?i)\\bIndy Library\\b")'
    severity: medium
    tags: [http, scripted-client]
    dedupe_by: [SrcIP, DstIP, Host]
    enabled: true
  - name: Host Identity In HTTP Check-in
    description: A request to a public endpoint includes a MAC address or workstation name in a check-in parameter.
    type: HTTP
    expression: 'Method != "" && IsPublicIP(DstIP) && MatchesPattern(URL, "(?i)[?&](?:mac=(?:[0-9a-f]{2}[-:]){5}[0-9a-f]{2}(?:&|$)|md=[^&]*(?:\\(|%28)[^&()]*-PC(?:\\)|%29))")'
    severity: medium
    tags: [http, check-in]
    dedupe_by: [SrcIP, DstIP, Host]
    enabled: true
  - name: Onion Destination In Cleartext HTTP
    description: An onion destination appeared in the Host field of a cleartext request.
    type: HTTP
    expression: 'Method != "" && MatchesPattern(Host, "(?i)[.]onion[.]?(?::[0-9]+)?$")'
    severity: high
    tags: [tor, onion, http]
    dedupe_by: [SrcIP, DstIP, Host]
    enabled: true
  - name: Onion Destination In DNS
    description: An onion name was sent to a DNS resolver instead of being resolved by Tor.
    type: DNS
    expression: '!QR && any(Questions, {MatchesPattern(.Name, "(?i)[.]onion[.]?$")})'
    severity: high
    tags: [tor, onion, dns]
    enabled: true
  - name: Tor-Like Relay Certificate
    description: A public TLS connection carried a Tor-like server certificate. The certificate is supporting evidence; it does not identify the session by itself.
    type: Connection
    expression: 'IsPublicIP(DstIP) && TorLikeCertificateSHA256 != "" && !("TOR" in Applications)'
    severity: medium
    tags: [tor, tls, heuristic]
    dedupe_by: [SrcIP, DstIP, DstPort]
    enabled: true
  - name: Repeated Opaque HTTP Check-In
    description: Repeated root POSTs with a small opaque body and an algorithmic-looking host. Legitimate telemetry is possible.
    type: HTTP
    expression: 'Method == "POST" && URL == "/" && IsPublicIP(DstIP) && ReqContentLength >= 32 && ReqContentLength <= 512 && Referer == "" && len(ReqCookies) == 0 && MatchesPattern(Host, "(?i)^[a-z0-9]{15,32}[.][a-z0-9]{5,12}[.](com|net|org)$") && MatchesPattern(Host, "[0-9]")'
    severity: medium
    tags: [http, check-in, c2]
    threshold: 5
    threshold_window: 300
    group_by: [SrcIP, Host]
    enabled: true
  - name: Scripted HTTP Ad Interaction
    description: A scripted ad-interaction client sent a MAC address to a public HTTP destination. This characterizes the traffic, not actual billing impact.
    type: HTTP
    expression: 'Method != "" && IsPublicIP(DstIP) && MatchesPattern(UserAgent, "(?i)\\bClickAdsByIE\\b") && MatchesPattern(URL, "(?i)[?&]mac=(?:[0-9a-f]{2}[-:]){5}[0-9a-f]{2}(?:&|$)")'
    severity: medium
    tags: [http, scripted-client, ad-fraud]
    dedupe_by: [SrcIP, DstIP, Host]
    enabled: true
  - name: HTTP Check-In On IRC Port
    description: One client sent decoded HTTP POSTs to multiple servers on an IRC service port. The wire protocol is HTTP.
    type: HTTP
    expression: 'Method == "POST" && StatusCode >= 100 && DstPort >= 6660 && DstPort <= 6669 && IsPublicIP(DstIP)'
    severity: medium
    tags: [http, protocol-anomaly]
    distinct_field: DstIP
    distinct_threshold: 3
    threshold_window: 1800
    dedupe_by: [SrcIP, DstPort]
    dedupe_window: 1800
    enabled: true
  - name: Repeated DNS Name Lookup Failure
    description: One client repeatedly received NXDOMAIN for a long registrable name under an often-abused suffix. Check for retries by a loader or a misconfigured client.
    type: DNS
    expression: 'QR && ResponseCode == 3 && SrcPort == 53 && len(Questions) == 1 && MatchesPattern(Questions[0].Name, "(?i)^[a-z0-9-]{12,32}[.](top|gdn|bit|xyz|cc|pw|tk|cyou|buzz|zip|site)[.]?$")'
    severity: medium
    tags: [dns, lookup-failure]
    threshold: 12
    threshold_window: 300
    group_by: [DstIP, Questions.Name]
    enabled: true
  - name: Repeated Failed TCP Contact On RAT-Associated Port
    description: Multiple refused or unanswered TCP attempts to a public endpoint on a port associated with legacy RATs. No remote-control session was observed.
    type: Connection
    expression: 'TCPInitiatorObserved && IsPrivateIP(SrcIP) && IsPublicIP(DstIP) && DstPort == "4502" && NumSYNFlags > 0 && !Established && (PacketsServerToClient == 0 || NumRSTFlags > 0) && AppPayloadSize64 == 0'
    severity: medium
    tags: [rat, attempted-contact]
    threshold: 3
    threshold_window: 300
    group_by: [SrcIP, DstIP, DstPort]
    enabled: true
