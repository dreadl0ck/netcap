    # tuned-v0.16.13: require an established client session (ACK + payload): SYN-only scan probes no longer fire one alert per target
    description: SMB file sharing detected - frequent vector for ransomware and lateral movement
    type: SMB
    expression: '!IsResponse && DstPort in [139, 445]'
    severity: info
    mitre: ["T1021.002", "T1570", "T1486"]
    tags: ["ransomware", "lateral-movement"]
    enabled: true
    dedupe_by: [SrcIP, DstIP, DstPort]

  # Port 1080: SOCKS Proxy
  - name: SOCKS Proxy Detected
