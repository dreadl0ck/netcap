    severity: medium
    mitre: ["T1090.001", "T1572"]
    tags: ["proxy", "tunneling"]
    enabled: false # Covered by protocol-based SOCKS Proxy Traffic Detected.
    dedupe_by: [SrcIP, DstIP, DstPort]

