  # Port 3389: RDP
  - name: RDP Detected
    description: A private RDP server accepted protocol negotiation; authentication is unknown.
    type: RDP
    expression: 'NegotiationOutcome == "accepted" && IsPrivateIP(DstIP)'
    severity: info
    mitre: ["T1021.001"]
    tags: ["remote-desktop", "ransomware"]
