  # ========================================
  # HIGH RISK PORTS (Monitoring Recommended)
  # ========================================

  # Port 25: SMTP
  - name: SMTP Detected
    # tuned-v0.16.13: protocol inventory; spam/C2 shapes are covered by fan-out and C2 rules
    # tuned-v0.16.13: require an established client session (ACK + payload): SYN-only scan probes no longer fire one alert per target
    description: SMTP mail transfer detected - monitor for open relays and outbound spam
    type: Connection
    expression: 'TCPInitiatorObserved && Established && DstPort == "25"'
    severity: info
    mitre: ["T1071.003"]
    tags: ["email"]
    enabled: true
    dedupe_by: [SrcIP, DstIP, DstPort]

  # Port 53: DNS
