# Credential Security Detection Rules
# Detect weak, cleartext, or compromised credentials in network traffic

description: "Detection rules for credential security issues including cleartext passwords, weak credentials, and brute force indicators."

rules:
  # Cleartext Credential Detection
  - name: Cleartext Password Captured
    description: Plaintext password observed on an unencrypted protocol (FTP, Telnet, HTTP Basic, POP3, IMAP)
    type: Secret
    expression: 'Password != "" && !MatchesPattern(Password, "^<(encrypted|CHAP|NTLM)") && !MatchesPattern(Service, "(?i)(RADIUS|Kerberos|NTLMSSP)")'
    severity: high
    mitre: ["T1552.001", "T1040"]
    tags: ["cleartext", "credential-exposure"]
    enabled: true

  # Weak/Default Password Patterns
  - name: Default or Weak Password
    description: Password matches common default or weak patterns
    type: Secret
    expression: 'MatchesPattern(Password, "(?i)^(admin|password|123456|12345678|root|test|guest|changeme|default|letmein|welcome|qwerty|abc123|passw0rd|p@ssw0rd)$")'
    severity: high
    mitre: ["T1078.001"]
    tags: ["weak-password", "default-credential"]
    enabled: true

  - name: SNMP Default Community String
    description: SNMP using well-known default community string
    type: Secret
    expression: 'Service == "SNMP" && MatchesPattern(Password, "(?i)^(public|private|community)$")'
    severity: medium
    mitre: ["T1078.001"]
    tags: ["snmp", "default-credential"]
    enabled: true

  # Authentication Failure Indicators
  - name: Multiple Auth Attempts
    description: Multiple authentication attempts detected for a single credential
    type: Secret
    expression: 'AuthAttempts > 5'
    severity: medium
    mitre: ["T1110"]
    tags: ["brute-force"]
    enabled: true

  # Protocol-Specific Credential Issues
  - name: FTP Cleartext Login
    description: FTP login credentials captured in cleartext
    type: Secret
    expression: 'Service == "FTP" && User != "" && Password != ""'
    severity: medium
    mitre: ["T1552.001"]
    tags: ["cleartext", "ftp"]
    enabled: true

  - name: Telnet Cleartext Login
    description: Telnet login credentials captured in cleartext
    type: Secret
    expression: 'Service == "Telnet" && User != "" && Password != ""'
    severity: high
    mitre: ["T1552.001", "T1021.001"]
    tags: ["cleartext", "telnet"]
    enabled: true

  - name: HTTP Basic Auth Cleartext
    description: HTTP Basic Authentication credentials captured (base64-encoded cleartext)
    type: Secret
    expression: 'Service == "HTTP" && User != "" && Password != ""'
    severity: medium
    mitre: ["T1552.001"]
    tags: ["cleartext", "http"]
    enabled: true
