# IOC list rules: match indicators from plain-text feeds in the iocs folder of
# the netcap config root (NC_IOC_DIR overrides it). One indicator per line,
# case-insensitive, '#' starts a comment. Disabled until a feed is installed.
description: "Indicator list matches for file hashes, domains, IP addresses, TLS server names and JA4 fingerprints"

rules:
  - name: File Hash In IOC List
    description: Extracted file whose MD5, SHA1 or SHA256 is listed in iocs/hashes.txt
    type: File
    expression: 'InList(Hashes?.SHA256, "hashes.txt") || InList(Hashes?.SHA1, "hashes.txt") || InList(Hashes?.MD5, "hashes.txt")'
    severity: high
    mitre: ["T1105"]
    tags: ["ioc", "malware"]
    enabled: false

  - name: DNS Query For IOC Domain
    description: DNS question for a domain listed in iocs/domains.txt
    type: DNS
    expression: '!QR && any(Questions, InList(IOCHost(.Name), "domains.txt"))'
    severity: high
    mitre: ["T1071.004"]
    tags: ["ioc", "c2"]
    enabled: false
    dedupe_by: [SrcIP, Questions.Name]

  - name: Connection To IOC Address
    description: Connection to an IP address listed in iocs/ips.txt
    type: Connection
    expression: 'InList(DstIP, "ips.txt") || InList(SrcIP, "ips.txt")'
    severity: high
    mitre: ["T1071"]
    tags: ["ioc", "c2"]
    enabled: false
    dedupe_by: [SrcIP, DstIP]

  - name: TLS Server Name In IOC List
    description: TLS ClientHello naming a server listed in iocs/domains.txt
    type: TLSClientHello
    expression: 'SNI != "" && InList(IOCHost(SNI), "domains.txt")'
    severity: high
    mitre: ["T1071.001", "T1573"]
    tags: ["ioc", "c2"]
    enabled: false
    dedupe_by: [SrcIP, SNI]

  - name: TLS Client Fingerprint In IOC List
    description: TLS ClientHello whose JA4 fingerprint is listed in iocs/ja4.txt
    type: TLSClientHello
    expression: 'Ja4 != "" && InList(Ja4, "ja4.txt")'
    severity: medium
    mitre: ["T1071.001"]
    tags: ["ioc", "fingerprint"]
    enabled: false
    dedupe_by: [SrcIP, Ja4]

  - name: TLS Client JA3 In IOC List
    description: TLS ClientHello whose JA3 fingerprint is listed in iocs/ja3.txt
    type: TLSClientHello
    expression: 'InList(Ja3, "ja3.txt")'
    severity: medium
    tags: ["ioc", "fingerprint"]
    enabled: false
    dedupe_by: [SrcIP, DstIP]

  - name: TLS Leaf Certificate In IOC List
    description: TLS leaf certificate whose SHA256 fingerprint is listed in iocs/cert-sha256.txt
    type: TLSCertificate
    expression: 'ChainIndex == 0 && InList(SHA256Fingerprint, "cert-sha256.txt")'
    severity: high
    tags: ["ioc", "certificate"]
    enabled: false
    dedupe_by: [SrcIP, SHA256Fingerprint]

  - name: HTTP Host Or URL In IOC List
    description: HTTP request to a host or exact URL on a local IOC feed
    type: HTTP
    expression: 'Method != "" && (InList(IOCHost(Host), "domains.txt") || HTTPURLInList(Host, URL, "urls.txt"))'
    severity: high
    tags: ["ioc", "http"]
    enabled: false
    dedupe_by: [SrcIP, Host, URL]

  - name: TLS To Recently Registered Domain
    description: Outbound TLS to a domain registered within 14 days of the capture, according to the local registration feed
    type: TLSClientHello
    expression: 'IsPrivateIP(SrcIP) && IsPublicIP(DstIP) && (let age = DomainAgeDays(SNI, Timestamp, "domain-registration.txt"); age >= 0 && age <= 14)'
    severity: low
    tags: ["hunt", "domain-age", "tls"]
    enabled: false
    dedupe_by: [SrcIP, SNI]

  - name: Recently Valid TLS Certificate From Listed Issuer
    description: Public TLS leaf first valid within the past day at capture time, from an operator-listed issuer
    type: TLSCertificate
    expression: 'ChainIndex == 0 && IsPublicIP(SrcIP) && NotBefore > 0 && Timestamp >= NotBefore && Timestamp - NotBefore <= 86400000000000 && InList(IssuerCommonName, "cert-issuers.txt")'
    severity: low
    tags: ["ioc", "certificate"]
    enabled: false
    dedupe_by: [SrcIP, SHA256Fingerprint]
