# Threshold-Based Detection Rules
# These rules demonstrate threshold alerting - only triggering after N matches within a time window
# This is useful for detecting patterns like brute force, scanning, or anomalous behavior

description: "Threshold-based detection rules that trigger alerts after N events within a time window. Detects brute force attacks, port scanning, network reconnaissance, DoS attacks, C2 beaconing patterns, web application attacks, and lateral movement through rate-based analysis."

rules:
  # ========================================
  # Brute Force Detection
  # ========================================
  
  # SSH Brute Force - multiple connection attempts to SSH
  - name: SSH Brute Force
    description: 'One source opens 50+ SSH connections to the same server within 120 seconds'
    type: TCP
    expression: DstPort == 22 && SYN && !ACK
    severity: high
    mitre: ["T1110.001", "T1021.004"]
    tags: ["brute-force"]
    enabled: true
    group_by: ["SrcIP", "DstIP"]
    threshold: 50
    threshold_window: 120

  # RDP Brute Force - multiple connection attempts to RDP
  - name: RDP Brute Force
    description: 'One source opens 30+ RDP connections to the same server within 120 seconds'
    type: TCP
    expression: DstPort == 3389 && SYN && !ACK
    severity: high
    mitre: ["T1110.001", "T1021.001"]
    tags: ["brute-force"]
    enabled: true
    group_by: ["SrcIP", "DstIP"]
    threshold: 30
    threshold_window: 120

  # Web Login Brute Force - multiple POST requests to login endpoints
  - name: Web Login Brute Force
    description: 'One client sends 100+ POSTs to login endpoints on the same server within 300 seconds'
    type: HTTP
    expression: Method == "POST" && MatchesPattern(URL, "(?i)(login|signin|auth)")
    severity: high
    mitre: ["T1110.001"]
    tags: ["brute-force"]
    enabled: true
    group_by: ["SrcIP", "DstIP"]
    threshold: 100
    threshold_window: 300

  # ========================================
  # Data Exfiltration
  # ========================================
  
  # High Volume External DNS Queries - potential DNS tunneling
  # Tunnels encode data in long query names; ordinary lookups rarely reach
  # 50 characters, so a browsing burst of short names does not count.
  - name: DNS Tunneling Volume
    description: One host sends 100+ DNS queries with names of 50+ characters to external resolvers within 60 seconds
    type: DNS
    expression: '!QR && len(Questions) > 0 && len(Questions[0].Name) >= 50 && IsPublicIP(DstIP)'
    severity: medium
    mitre: ["T1071.004"]
    tags: ["tunneling"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 100
    threshold_window: 60

  # Large File Upload Pattern - multiple large POST requests
  - name: Large Upload Pattern
    description: 'One host sends 20+ HTTP POSTs over 100 KB to public addresses within 600 seconds'
    type: HTTP
    expression: Method == "POST" && ReqContentLength > 100000 && IsPublicIP(DstIP)
    severity: medium
    mitre: ["T1041", "T1567.002"]
    tags: ["exfiltration"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 20
    threshold_window: 600

  # ========================================
  # Denial of Service
  # ========================================
  
  # SYN Flood Detection
  - name: SYN Flood Detection
    description: 'One destination receives 10,000+ SYNs within 10 seconds'
    type: TCP
    expression: SYN && !ACK && !RST
    severity: medium
    mitre: ["T1499.002"]
    tags: ["dos"]
    enabled: true
    group_by: ["DstIP"]
    threshold: 10000
    threshold_window: 10

  # UDP Flood Detection
  - name: UDP Flood Detection
    description: 'One destination receives 10,000+ UDP packets with payload within 10 seconds'
    type: UDP
    expression: PayloadSize > 0
    severity: medium
    mitre: ["T1499.002"]
    tags: ["dos"]
    enabled: true
    group_by: ["DstIP"]
    threshold: 10000
    threshold_window: 10

  # ========================================
  # Command and Control
  # ========================================
  
  # Beaconing Pattern - regular HTTP requests with small payloads
  # Noisy, disabled by default.
  - name: C2 Beaconing Pattern
    description: 'One host sends 50+ small HTTP GET/POST requests to the same public server within 600 seconds'
    type: HTTP
    expression: (Method == "GET" || Method == "POST") && ReqContentLength < 100 && IsPublicIP(DstIP)
    severity: medium
    mitre: ["T1071.001"]
    tags: ["beaconing"]
    enabled: false
    group_by: ["SrcIP", "DstIP"]
    threshold: 50
    threshold_window: 600

  # Suspicious DNS Beaconing - frequent queries to same domain
  - name: DNS Beaconing Pattern
    description: One host sends 100+ DNS queries for the same name to external resolvers within 600 seconds
    type: DNS
    expression: '!QR && len(Questions) > 0 && IsPublicIP(DstIP)'
    severity: low
    mitre: ["T1071.004"]
    tags: ["beaconing"]
    enabled: true
    group_by: ["SrcIP", "Questions.Name"]
    threshold: 100
    threshold_window: 600

  # ========================================
  # Web Application Attacks
  # ========================================
  
  # SQL Injection Attack Pattern
  - name: SQL Injection Attack Pattern
    description: 'One client sends 20+ URLs with SQL injection keywords within 300 seconds'
    type: HTTP
    expression: MatchesPattern(URL, "(?i)(union.*select|insert.*into|delete.*from|drop.*table)")
    severity: high
    mitre: ["T1190"]
    tags: ["sql-injection"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 20
    threshold_window: 300

  # Directory Traversal Attack Pattern
  - name: Directory Traversal Attack Pattern
    description: 'One client sends 20+ directory traversal URLs within 300 seconds'
    type: HTTP
    expression: MatchesPattern(URL, "\\.\\./|\\.\\.\\\\")
    severity: high
    mitre: ["T1083"]
    tags: ["path-traversal"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 20
    threshold_window: 300

  # Web Scanner Activity
  - name: Web Scanner Activity
    description: 'One client sends 50+ requests with scanner user agents within 120 seconds'
    type: HTTP
    expression: MatchesPattern(UserAgent, "(?i)(nikto|nmap|masscan|sqlmap|burp|nessus|acunetix)")
    severity: low
    mitre: ["T1595.002"]
    tags: ["scanner"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 50
    threshold_window: 120

  # ========================================
  # Lateral Movement
  # ========================================
  
  # SMB Enumeration Pattern
  - name: SMB Enumeration Pattern
    description: 'One internal host opens SMB connections to 30+ distinct internal hosts within 60 seconds'
    type: TCP
    expression: DstPort == 445 && IsPrivateIP(SrcIP) && IsPrivateIP(DstIP) && SYN && !ACK
    severity: low
    mitre: ["T1021.002", "T1135"]
    tags: ["lateral-movement"]
    enabled: true
    distinct_field: DstIP
    distinct_threshold: 30
    threshold_window: 60

  # Kerberos Authentication Spike
  - name: Kerberos Authentication Spike
    description: 'One host sends 100+ packets to Kerberos (port 88) within 120 seconds'
    type: TCP
    expression: DstPort == 88
    severity: info
    mitre: ["T1558.001", "T1558.003"]
    tags: ["lateral-movement"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 100
    threshold_window: 120

  # ========================================
  # Anomalous Behavior
  # ========================================
  
  # Unusual Non-Standard Port Usage
  - name: High Port Activity
    description: 'One host opens 200+ connections to ports above 49152 within 60 seconds'
    type: TCP
    expression: DstPort > 49152 && SYN && !ACK
    severity: info
    mitre: ["T1571"]
    tags: ["anomaly"]
    enabled: true
    group_by: ["SrcIP"]
    threshold: 200
    threshold_window: 60

  # Connection to Multiple External IPs
  # Web ports are excluded: browsing a modern site opens dozens of HTTPS
  # connections to distinct CDN addresses.
  - name: Multiple External Connections
    description: One host opens connections to 50+ distinct public IPs on non-web ports within 60 seconds
    type: TCP
    expression: IsPublicIP(DstIP) && SYN && !ACK && DstPort != 80 && DstPort != 443 && DstPort != 8080 && DstPort != 8443
    severity: info
    mitre: ["T1071"]
    tags: ["anomaly"]
    enabled: true
    distinct_field: DstIP
    distinct_threshold: 50
    threshold_window: 60

