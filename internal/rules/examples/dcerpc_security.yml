# DCE/RPC Security Detection Rules
# Interface and operation names come from the connection's Bind/AlterContext
# contexts, so a request is attributed only when its context was observed.
# A request is an attempt: the Response/Fault record carries the outcome.

description: "Detection rules for DCE/RPC-based attacks including DCSync, remote service and task creation, registry modification, account enumeration and authentication coercion."

rules:
  # DCSync - DRSUAPI replication. Domain controllers replicate legitimately;
  # approve them with !IsApprovedWorkstation(SrcIP) or a source allowlist.
  - name: DCERPC DRSUAPI GetNCChanges
    description: IDL_DRSGetNCChanges request, the directory replication call used by DCSync credential dumping; expected only between domain controllers
    type: DCERPC
    expression: 'OperationName == "IDL_DRSGetNCChanges" && PacketTypeName == "Request"'
    severity: critical
    mitre: ["T1003.006"]
    tags: ["dcerpc", "credential-access", "dcsync"]
    enabled: true

  # SAMR - Security Account Manager Remote
  - name: DCERPC SAMR User Enumeration
    description: SAMR domain or user enumeration request, commonly used for remote account discovery in Active Directory
    type: DCERPC
    expression: 'InterfaceName == "SAMR" && PacketTypeName == "Request" && OperationName in ["SamrEnumerateDomainsInSamServer", "SamrEnumerateUsersInDomain", "SamrLookupNamesInDomain"]'
    severity: medium
    mitre: ["T1087.002"]
    tags: ["dcerpc", "discovery", "user-enumeration"]
    enabled: true

  # SVCCTL - remote service creation, as used by PsExec-style lateral movement
  - name: DCERPC Remote Service Creation
    description: Remote Service Control Manager service creation request; correlate with RStartServiceW and the Response/Fault outcome
    type: DCERPC
    expression: 'PacketTypeName == "Request" && OperationName in ["RCreateServiceW", "RCreateServiceA", "RCreateServiceWOW64W"]'
    severity: high
    mitre: ["T1569.002", "T1543.003"]
    tags: ["dcerpc", "execution", "remote-service"]
    enabled: true

  # WINREG - Remote Registry writes
  - name: DCERPC Remote Registry Modification
    description: Remote registry create, delete or set-value request via WINREG
    type: DCERPC
    expression: 'InterfaceName == "WINREG" && PacketTypeName == "Request" && OperationName in ["BaseRegCreateKey", "BaseRegDeleteKey", "BaseRegSetValue"]'
    severity: high
    mitre: ["T1112"]
    tags: ["dcerpc", "defense-evasion", "remote-registry"]
    enabled: true

  # EFSR - Encrypted File System Remote (PetitPotam / EFSRPotato)
  - name: DCERPC EFSR Coercion Attempt
    description: EFSR interface request detected, commonly exploited in PetitPotam and similar NTLM relay coercion attacks
    type: DCERPC
    expression: 'InterfaceName == "EFSR" && PacketTypeName == "Request"'
    severity: critical
    mitre: ["T1187"]
    tags: ["dcerpc", "credential-access", "coercion", "petitpotam"]
    enabled: true

  # Remote scheduled task or job creation
  - name: DCERPC Remote Scheduled Task Creation
    description: Remote task registration (ITaskSchedulerService) or job creation (ATSVC), used for persistence and lateral movement
    type: DCERPC
    expression: 'PacketTypeName == "Request" && OperationName in ["SchRpcRegisterTask", "NetrJobAdd"]'
    severity: high
    mitre: ["T1053.005", "T1053.002"]
    tags: ["dcerpc", "execution", "scheduled-task", "persistence"]
    enabled: true
