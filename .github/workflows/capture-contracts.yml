name: Capture contracts

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/capture-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/check-mcp-stdio.py'
      - 'tests/e2e/**'
      - 'internal/exitcode/**'
      - 'docs/mcp/tools.md'
      - 'defaults/**/*.go'
      - 'internal/aggregate/**/*.go'
      - 'internal/analyst/**'
      - 'internal/artifactio/**/*.go'
      - 'internal/behavior/**'
      - 'internal/delimited/**/*.go'
      - 'internal/rules/**'
      - 'internal/evidence/**/*.go'
      - 'internal/packetview/**/*.go'
      - 'internal/packetmeta/**/*.go'
      - 'internal/webtech/**'
      - 'internal/netio/**/*.go'
      - 'internal/networkdetect/**/*.go'
      - 'internal/collector/**/*.go'
      - 'internal/collector/testdata/**'
      - 'testdata/recheck-v0168/base_http.pcap'
      - 'tests/integration/**'
      - 'internal/decoder/**/*.go'
      - 'internal/decoder/**/testdata/**'
      - 'internal/mcp/**/*.go'
      - 'internal/reassembly/**/*.go'
      - 'cmd/capture/**/*.go'
      - 'cmd/mcp/**/*.go'
      - 'cmd/net/**/*.go'
  pull_request:
    paths:
      - '.github/workflows/capture-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/check-mcp-stdio.py'
      - 'tests/e2e/**'
      - 'internal/exitcode/**'
      - 'docs/mcp/tools.md'
      - 'defaults/**/*.go'
      - 'internal/aggregate/**/*.go'
      - 'internal/analyst/**'
      - 'internal/artifactio/**/*.go'
      - 'internal/behavior/**'
      - 'internal/delimited/**/*.go'
      - 'internal/rules/**'
      - 'internal/evidence/**/*.go'
      - 'internal/packetview/**/*.go'
      - 'internal/packetmeta/**/*.go'
      - 'internal/webtech/**'
      - 'internal/netio/**/*.go'
      - 'internal/networkdetect/**/*.go'
      - 'internal/collector/**/*.go'
      - 'internal/collector/testdata/**'
      - 'testdata/recheck-v0168/base_http.pcap'
      - 'tests/integration/**'
      - 'internal/decoder/**/*.go'
      - 'internal/decoder/**/testdata/**'
      - 'internal/mcp/**/*.go'
      - 'internal/reassembly/**/*.go'
      - 'cmd/capture/**/*.go'
      - 'cmd/mcp/**/*.go'
      - 'cmd/net/**/*.go'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  GOMAXPROCS: '4'
  GOFLAGS: '-p=2'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify tracked module archive
        run: go test ./tests/modulearchive -count=1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/capture/webui/frontend/pnpm-lock.yaml
      - name: Install capture headers
        timeout-minutes: 4
        run: |
          apt_options=(-o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_options[@]}" update &&
               sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libpcap-dev; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then
              sleep "$((attempt * 5))"
            fi
          done
          exit 1
      - name: Build embedded interface
        working-directory: cmd/capture/webui/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Verify capture completion and output contracts
        run: go test -tags nodpi,noyara,nomagika ./internal/collector -count=1 -timeout=10m
      - name: Verify Protobuf capture selection
        env:
          NETCAP_REQUIRE_FIXTURES: '1'
        run: go test -tags integration,nodpi,noyara,nomagika ./tests/integration -run '^TestProtobufPCAPExtraction$' -count=1 -timeout=2m
      - name: Verify official MCP stdio contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-check"
          "$RUNNER_TEMP/mcp-check/bin/pip" install uv==0.9.13
          go build -tags nodpi,noyara,nomagika -o "$RUNNER_TEMP/net" ./cmd/net
          "$RUNNER_TEMP/mcp-check/bin/uv" run --script scripts/check-mcp-stdio.py "$RUNNER_TEMP/net"
      - name: Verify App Store WebUI build and in-process analysis
        run: go test -tags appstore,nodpi,noyara,nomagika ./cmd/capture/webui -count=1 -timeout=5m
      - name: Verify service-mode and rule regressions end to end
        run: go test -tags e2e,nodpi,noyara,nomagika ./tests/e2e -run '^(TestServicePartialCapture|TestRecheck1612CLI|TestHuntCLIRegressions)$' -count=1 -timeout=10m
      - name: Verify large-alert contracts over MCP Streamable HTTP
        run: '"$RUNNER_TEMP/mcp-check/bin/uv" run --script scripts/check-mcp-stdio.py "$RUNNER_TEMP/net" --http-alerts'
      - name: Verify resource ownership and reader races
        run: >-
          go test -race -tags nodpi,noyara,nomagika
          ./internal/aggregate ./internal/reassembly ./internal/decoder/core
          ./internal/analyst/... ./internal/artifactio ./internal/delimited ./internal/rules
          ./internal/behavior/...
          ./internal/evidence ./internal/packetview ./internal/packetmeta
          ./internal/webtech ./internal/netio ./internal/networkdetect
          ./internal/decoder/stream/file ./internal/decoder/stream/http
          ./internal/decoder/stream ./internal/decoder/stream/utils
          ./internal/decoder/stream/tcp ./internal/decoder/stream/tls
          ./internal/decoder/stream/secret ./internal/decoder/stream/ftp
          ./internal/decoder/stream/imap ./internal/decoder/stream/irc
          ./internal/decoder/stream/smtp ./internal/decoder/stream/pop3
          ./internal/mcp ./cmd/capture ./cmd/capture/webui ./cmd/mcp ./cmd/net
          -count=1 -timeout=5m
      - name: Check affected packages
        run: >-
          go vet -tags nodpi,noyara,nomagika
          ./internal/aggregate ./internal/reassembly ./internal/decoder/core
          ./internal/analyst/... ./internal/artifactio ./internal/delimited ./internal/rules
          ./internal/behavior/...
          ./internal/evidence ./internal/packetview ./internal/packetmeta
          ./internal/webtech ./internal/netio ./internal/networkdetect
          ./internal/decoder/stream/file ./internal/decoder/stream/http
          ./internal/decoder/stream ./internal/decoder/stream/utils
          ./internal/decoder/stream/tcp ./internal/decoder/stream/tls
          ./internal/decoder/stream/secret ./internal/decoder/stream/ftp
          ./internal/decoder/stream/imap ./internal/decoder/stream/irc
          ./internal/decoder/stream/smtp ./internal/decoder/stream/pop3
          ./internal/mcp ./cmd/capture ./cmd/capture/webui ./cmd/mcp ./cmd/net
