name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicitly configure permissions for GITHUB_TOKEN
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read and agree to the NETCAP CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For storing signatures in a Gist (recommended for privacy)
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          # Path to individual CLA document
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/master/CLA-INDIVIDUAL.md'
          
          # Branch where signatures will be stored
          branch: 'main'
          
          # Allowlist for bots and automated accounts (won't be asked to sign)
          allowlist: bot*,dependabot[bot],renovate[bot],github-actions[bot]

          # Custom messages
          custom-notsigned-prcomment: |
            Thank you for your contribution to NETCAP!
            
            Before we can accept your pull request, you need to sign our Contributor License Agreement (CLA).
            
            **To sign the CLA**, please read the [Individual CLA](https://github.com/${{ github.repository }}/blob/master/CLA-INDIVIDUAL.md) and comment below with:
            
            ```
            I have read and agree to the NETCAP CLA
            ```
            
            If you are contributing on behalf of a company or organization, please contact the maintainers to complete the [Entity CLA](https://github.com/${{ github.repository }}/blob/master/CLA-ENTITY.md) instead.
            
            ---
            *You can re-trigger this check by commenting `recheck` on this PR.*

          custom-pr-sign-comment: 'I have read and agree to the NETCAP CLA'
          
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you!
            
          # Lock PRs from users who haven't signed
          lock-pullrequest-aftermerge: false
          
          # Use pull request author's email for signature
          use-dco-flag: false

