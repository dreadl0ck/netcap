name: CI

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, windows, macos]
        default: full

# A second push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit block the GITHUB_TOKEN inherits the repository default,
# which may be read-write. Nothing here writes: the job checks out, pulls a
# public image and installs from public npm. Declared at the top level so a
# future job inherits it rather than starting unrestricted.
permissions:
  contents: read

env:
  GOWORK: 'off'
  GOMAXPROCS: '4'
  GOFLAGS: '-p=2'
  # Build the native recipe from this revision; a shared tag can carry an old ABI.
  BUILDER_IMAGE: netcap-builder:ci-yara122

jobs:
  native-runtime:
    if: inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [alpine, alpine-nodpi, ubuntu, ubuntu-nodpi]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/capture/webui/frontend/pnpm-lock.yaml
      - name: Build embedded frontend
        working-directory: cmd/capture/webui/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Rebuild and qualify the final native x86 runtime
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          test "$(uname -m)" = x86_64
          case "$VARIANT" in
            alpine) builder=alpine-dpi; tags='' ;;
            alpine-nodpi) builder=alpine; tags='-tags nodpi' ;;
            ubuntu) builder=ubuntu-dpi; tags='' ;;
            ubuntu-nodpi) builder=ubuntu; tags='-tags nodpi' ;;
          esac
          image=$(python3 zeus/scripts/builder-image.py "$builder")
          docker run --rm --cpus=2 -v "$PWD:/netcap:ro" -w /netcap "$image" sh scripts/qualify-native-builder.sh
          docker buildx build --load --platform linux/amd64 \
            --build-context netcap-webui=cmd/capture/webui/frontend/dist \
            --build-arg "TAGS=$tags" --build-arg "NETCAP_BUILDER_IMAGE=$image" \
            -f "docker/$VARIANT/Dockerfile" -t netcap-final-native .
          python3 scripts/native-runtime-smoke.py --image netcap-final-native

  go:
    if: inputs.scope == 'full'
    name: Go build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Verify tracked Go module archive
        run: GOWORK=off go test ./tests/modulearchive -count=1

      # go-dpi is an ordinary pinned dependency here -- go.mod requires
      # the version in go.mod and the module proxy serves it. CI does NOT create
      # a go.work overlay: that would make the build resolve go-dpi from a
      # checkout of its default branch, so a release build would silently test
      # something other than the pinned version. Developers who need the
      # overlay create it locally with `zeus setup-workspace`.

      # The web UI bundle is gitignored and embedded with
      # `//go:embed all:frontend/dist`, so without these steps every
      # `go build ./...` fails with
      # "pattern all:frontend/dist: no matching files found" -- which is exactly
      # what the first run in this workflow's history failed on.
      #
      # Building it for real, rather than committing a bundle or a placeholder,
      # means CI validates the artifact the image actually ships.
      #
      # This runs on the host rather than in the builder container because the
      # frontend needs no native dependencies, and host caching is simpler.

      # pnpm must be on PATH before setup-node, or its `cache: pnpm` cannot find
      # it. The version is pinned to match package.json's packageManager and the
      # Dockerfile, which keeps --frozen-lockfile honest against a
      # lockfileVersion 9.0 file.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/capture/webui/frontend/pnpm-lock.yaml

      - name: Build the web UI (required by go:embed)
        working-directory: cmd/capture/webui/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html

      - name: Build the matched native toolchain
        run: docker build --platform linux/amd64 -f docker/builders/alpine-dpi-builder.Dockerfile -t "$BUILDER_IMAGE" .

      # Everything below runs inside the builder image rather than on the
      # runner.
      #
      # The Go build needs nDPI headers, libprotoident and the yara-x C API.
      # The builder above compiles the pinned native sources from this revision.
      #
      # It is invoked with `docker run` rather than a job-level `container:`
      # because GitHub injects its own glibc-linked Node into container jobs to
      # execute JavaScript actions. The alpine builder is musl, and the
      # ubuntu-dpi builder is Ubuntu 18.04 (glibc 2.27, below the 2.28 that
      # Node 20+ needs), so neither can host the actions used above. Running the
      # container only for the build steps keeps checkout/setup-node on the
      # host where they work, and still gives the Go toolchain the exact
      # release environment.
      #
      # GOFLAGS=-buildvcs=false because the mounted .git is owned by a different
      # uid inside the container and Go otherwise refuses to stamp VCS info.
      - name: Build, vet and test in the builder image
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/netcap" \
            -w /netcap \
            -e 'GOFLAGS=-buildvcs=false -p=2' \
            -e GOWORK=off -e GOMAXPROCS=4 \
            -e 'GOPROXY=https://proxy.golang.org|direct' \
            "$BUILDER_IMAGE" \
            sh -eux <<'SCRIPT'
          go version

          # Database archive tests run pack-dbs.sh and its Python metadata validator.
          apk add --no-cache bash python3 tshark

          # Regenerate types/netcap.pb.go so it provably matches
          # types/netcap.proto. The file is tracked again since 3dbcc508
          # (it ships in the release archives), so this no longer rescues a
          # clean checkout -- it catches a proto edit committed without the
          # regenerated output. The script pins the plugin's source/toolchain;
          # the builder supplies protoc.
          #
          # --proto_path=types is required, not decoration: without it the
          # output lands in types/proto/ and the descriptor registers as
          # "types/netcap.proto" instead of "netcap.proto".
          cp types/netcap.pb.go /tmp/netcap.pb.go.expected
          sh scripts/gen-proto.sh
          test -s types/netcap.pb.go
          cmp /tmp/netcap.pb.go.expected types/netcap.pb.go

          go build ./...
          go vet ./...

          # JA4+ is source-only and opt-in. Compile and test it so the optional
          # path cannot rot while official builds continue to exclude the tag.
          go build -tags ja4plus ./...
          go vet -tags ja4plus ./...
          go test -short -tags ja4plus \
            ./internal/ja4/... \
            ./internal/ja4plusadapter/... \
            ./internal/decoder/packet \
            ./internal/decoder/stream/http \
            ./internal/decoder/stream/ssh \
            ./internal/decoder/stream/tls \
            ./internal/resolvers \
            ./internal/collector

          # Mirrors the test-unit target in Makefile. The race detector
          # works under musl here; verified against this image before relying on
          # it. collector was temporarily excluded after this suite found a TCP
          # reassembly race; it is back under the detector now that the fragment
          # ownership and completion lifecycle are fixed.
          go test -short -race -timeout=15m ./...
          GOWORK=off go test -tags=nodpi,noyara,nomagika ./cmd/capture -run '^TestCPUProfile' -count=1
          GOWORK=off go test -tags=e2e,nodpi,noyara,nomagika ./tests/e2e -run '^TestOfflineRulesCLI$' -count=1
          GOWORK=off go test -tags=e2e,nodpi,noyara,nomagika ./tests/e2e -run '^TestDHCPOption55CLI$' -count=1
          GOWORK=off go test -tags=e2e,nodpi,nomagika ./tests/e2e -run '^TestArtifactAnalysisCLI$' -count=1
          GOWORK=off go test -tags=e2e,nodpi,noyara,nomagika ./tests/e2e -run '^TestAuditSemanticsCLI$' -count=1
          GOWORK=off go test -tags=e2e,nodpi,noyara,nomagika ./tests/e2e -run '^TestTCPRetentionBudgetCLI$' -count=1 -timeout=8m
          GOWORK=off go test -tags=e2e,nodpi,noyara,nomagika ./tests -run '^TestNewDecoders_UltimatePCAP$' -count=1 -timeout=8m
          GOWORK=off go test -tags=nodpi,noyara,nomagika ./internal/decoder/stream/tls -run '^$' -fuzz '^FuzzCertificateHandshakeSemantics$' -fuzztime=5s -parallel=2
          GOWORK=off go test -tags=nodpi,noyara,nomagika ./internal/decoder/stream/rdp -run '^$' -fuzz '^FuzzNegotiationEvidence$' -fuzztime=5s -parallel=2
          NETCAP_TLS_CORPUS=1 GOWORK=off go test -tags=nodpi,noyara,nomagika ./internal/collector -run '^TestTLSRound2Corpus$' -count=1 -timeout=4m
          NETCAP_SMB_CORPUS=1 GOWORK=off go test -tags=nodpi,noyara,nomagika ./internal/decoder/stream/dcerpc -run '^TestSMBPinnedCorpus$' -count=1 -timeout=4m
          GOWORK=off go test -tags=nodpi,noyara,nomagika ./types -run '^$' -fuzz '^FuzzDHCPOptionRoundTrip$' -fuzztime=5s -parallel=2
          GOWORK=off go test -tags=nodpi,noyara,nomagika ./internal/packetview -run '^$' -fuzz '^FuzzPacketPipeline$' -fuzztime=5s -parallel=2
          SCRIPT

      - name: Verify distributable license bundle
        run: ./zeus/scripts/licenses.sh

  windows:
    if: inputs.scope != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/capture/webui/frontend/pnpm-lock.yaml
      - name: Build embedded frontend
        working-directory: cmd/capture/webui/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build and test the Windows client without Npcap
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          go build -tags nodpi,noyara -o net.exe ./cmd/net
          ./net.exe --version
          go test -tags nodpi,noyara ./internal/dbs ./internal/vulndb
          # This runner has no Npcap; BPF/export and POSIX permission suites run on Linux.
          go test -race -p 2 -timeout=15m -tags nodpi,noyara ./cmd/split ./internal/decoder/stream/cip
          go test -race -p 2 -timeout=15m -tags nodpi,noyara ./internal/netio -run '^Test(Reader|Writer|CountRecords|ChanWriter|ProtoWriter|DelimitedProtoWriter|SortRejects)'
          go test -race -p 2 -timeout=15m -tags nodpi,noyara ./internal/collector -run '^Test(LegacyPCAP|CaptureReader|CaptureInput(Synthetic|MixedInterfaces|EmptyPacket|DecodeQualification))'
          export NC_CONFIG_ROOT="$RUNNER_TEMP/netcap-db-qualification"
          ./net.exe util -download-dbs
          ./net.exe util -update-dbs
          NETCAP_TEST_COMMUNITY_DBS="$NC_CONFIG_ROOT/dbs" go test ./internal/dbs -run TestInstalledCommunityCompatibility -count=1
          python - <<'PY'
          import os, pathlib, struct
          frame=bytes.fromhex('ffffffffffff00112233445508060001080006040001001122334455c0000201000000000000c0000202')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'netcap-smoke.pcap'
          path.write_bytes(struct.pack('<IHHIIII',0xa1b2c3d4,2,4,0,0,65535,1)+struct.pack('<IIII',1,0,len(frame),len(frame))+frame)
          PY
          ./net.exe capture -read "$RUNNER_TEMP/netcap-smoke.pcap" -out "$RUNNER_TEMP/netcap-smoke-audits" -quiet -dpi=false -geoDB=false
          ./net.exe triage -read "$RUNNER_TEMP/netcap-smoke-audits" -json
      - uses: actions/upload-artifact@v4
        with:
          name: netcap-windows-qualified
          path: net.exe

  macos:
    if: inputs.scope == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, variant: nodpi-}
          - {os: macos-26, variant: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Qualify the exact bundled release on clean macOS
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          tag=$(git describe --tags --exact-match)
          asset="netcap-${VARIANT}${tag}-darwin-arm64.tar.gz"
          gh release download "$tag" --pattern "$asset" --pattern checksums.txt --dir "$RUNNER_TEMP/release"
          python3 - "$RUNNER_TEMP/release/$asset" "$RUNNER_TEMP/release/checksums.txt" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);expected=dict((name,digest) for digest,name in (line.split() for line in pathlib.Path(sys.argv[2]).read_text().splitlines()))
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected[p.name]
          PY
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/release/$asset" -C "$RUNNER_TEMP/extracted"
          binary=$(python3 -c 'import pathlib,sys;print(next(pathlib.Path(sys.argv[1]).rglob("net")))' "$RUNNER_TEMP/extracted")
          "$binary" --version
          export NC_CONFIG_ROOT="$RUNNER_TEMP/netcap-dbs"
          "$binary" util -download-dbs
          "$binary" util -update-dbs
