name: CI

on:
  workflow_dispatch:

# A second push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit block the GITHUB_TOKEN inherits the repository default,
# which may be read-write. Nothing here writes: the job checks out, pulls a
# public image and installs from public npm. Declared at the top level so a
# future job inherits it rather than starting unrestricted.
permissions:
  contents: read

env:
  # The same image the released service container is built from, so CI compiles
  # against the exact nDPI, libprotoident and yara-x it ships with.
  BUILDER_IMAGE: dreadl0ck/netcap-builder:alpine-dpi-latest

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      # go-dpi is an ordinary pinned dependency here -- go.mod requires
      # v1.4.1 and the module proxy serves it. CI deliberately does NOT create
      # a go.work overlay: that would make the build resolve go-dpi from a
      # checkout of its default branch, so a release build would silently test
      # something other than the pinned version. Developers who need the
      # overlay create it locally with `zeus setup-workspace`.

      # The web UI bundle is gitignored and embedded with
      # `//go:embed all:frontend/dist`, so without these steps every
      # `go build ./...` fails with
      # "pattern all:frontend/dist: no matching files found" -- which is exactly
      # what the first run in this workflow's history failed on.
      #
      # Building it for real, rather than committing a bundle or a placeholder,
      # means CI validates the artifact the image actually ships.
      #
      # This runs on the host rather than in the builder container because the
      # frontend needs no native dependencies, and host caching is simpler.

      # pnpm must be on PATH before setup-node, or its `cache: pnpm` cannot find
      # it. The version is pinned to match package.json's packageManager and the
      # Dockerfile, which keeps --frozen-lockfile honest against a
      # lockfileVersion 9.0 file.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/capture/webui/frontend/pnpm-lock.yaml

      - name: Build the web UI (required by go:embed)
        working-directory: cmd/capture/webui/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html

      - name: Pull the builder image
        run: docker pull "$BUILDER_IMAGE"

      # Everything below runs inside the builder image rather than on the
      # runner.
      #
      # The Go build needs nDPI headers, libprotoident and the yara-x C API.
      # Installing those on the runner means compiling nDPI and a Rust project
      # from source on every run; the builder image already has them, pinned to
      # the versions the release is built with, so CI and the shipped binary
      # cannot drift.
      #
      # It is invoked with `docker run` rather than a job-level `container:`
      # because GitHub injects its own glibc-linked Node into container jobs to
      # execute JavaScript actions. The alpine builder is musl, and the
      # ubuntu-dpi builder is Ubuntu 18.04 (glibc 2.27, below the 2.28 that
      # Node 20+ needs), so neither can host the actions used above. Running the
      # container only for the build steps keeps checkout/setup-node on the
      # host where they work, and still gives the Go toolchain the exact
      # release environment.
      #
      # GOFLAGS=-buildvcs=false because the mounted .git is owned by a different
      # uid inside the container and Go otherwise refuses to stamp VCS info.
      - name: Build, vet and test in the builder image
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/netcap" \
            -w /netcap \
            -e GOFLAGS=-buildvcs=false \
            "$BUILDER_IMAGE" \
            sh -eux <<'SCRIPT'
          go version

          # Regenerate types/netcap.pb.go so it provably matches
          # types/netcap.proto. The file is tracked again since 3dbcc508
          # (it ships in the release archives), so this no longer rescues a
          # clean checkout -- it catches a proto edit committed without the
          # regenerated output. protoc and the gogofaster plugin ship in the
          # builder image for this.
          #
          # --proto_path=types is required, not decoration: without it the
          # output lands in types/proto/ and the descriptor registers as
          # "types/netcap.proto" instead of "netcap.proto".
          protoc --proto_path=types --gogofaster_out=types/. types/netcap.proto
          test -s types/netcap.pb.go

          go build ./...
          go vet ./...

          # JA4+ is source-only and opt-in. Compile and test it so the optional
          # path cannot rot while official builds continue to exclude the tag.
          go build -tags ja4plus ./...
          go vet -tags ja4plus ./...
          go test -short -tags ja4plus \
            ./internal/ja4/... \
            ./internal/ja4plusadapter/... \
            ./internal/decoder/packet \
            ./internal/decoder/stream/http \
            ./internal/decoder/stream/ssh \
            ./internal/decoder/stream/tls \
            ./internal/resolvers \
            ./internal/collector

          # Mirrors the test-unit target in Makefile. The race detector
          # works under musl here; verified against this image before relying on
          # it. collector was temporarily excluded after this suite found a TCP
          # reassembly race; it is back under the detector now that the fragment
          # ownership and completion lifecycle are fixed.
          go test -short -race ./...
          SCRIPT

      - name: Verify distributable license bundle
        run: ./zeus/scripts/licenses.sh
