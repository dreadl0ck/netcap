apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firewall.configName" . }}
  labels:
    {{- include "firewall.labels" . | nindent 4 }}
immutable: true
data:
  config.yaml: |
    {{- include "firewall.config" . | nindent 4 }}
  policy.yaml: |
    {{- toYaml .Values.policy | nindent 4 }}
  {{- range .Values.routes }}
  route-{{ .id }}.yaml: |
    {{- toYaml .policy | nindent 4 }}
  {{- end }}
