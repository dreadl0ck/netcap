apiVersion: apps/v1
kind: {{ if eq .Values.mode "fleet" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "firewall.name" . }}
  labels:
    {{- include "firewall.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.mode "fleet" }}
  serviceName: {{ include "firewall.name" . }}-targets
  podManagementPolicy: Parallel
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  {{- if eq .Values.mode "managed" }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      {{- include "firewall.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firewall.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: firewall
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /etc/netcap-firewall/config.yaml
            {{- if .Values.adminTokenSecret.name }}
            - --legacy-admin
            {{- end }}
            {{- if .Values.websocket }}
            - --websocket
            {{- end }}
            {{- if .Values.routeID }}
            - --route-id={{ .Values.routeID }}
            {{- end }}
            {{- if .Values.grpc }}
            - --grpc
            {{- end }}
            {{- if .Values.http3.enabled }}
            - --http3-listen=:{{ .Values.http3.port }}
            {{- end }}
            {{- if .Values.sharedRate.configSecretName }}
            - --shared-rate-config=/etc/shared-rate/config.json
            {{- end }}
            {{- if .Values.policyState.configSecretName }}
            - --policy-state-config=/etc/policy-state/config.json
            {{- end }}
            {{- if eq .Values.mode "fleet" }}
            - --fleet-agent-config=/etc/fleet/$(POD_NAME).json
            {{- end }}
            {{- if eq .Values.mode "managed" }}
            - --managed
            - --state-dir
            - /var/lib/netcap-firewall/managed
            {{- end }}
            {{- if .Values.adminTLS.secretName }}
            - --admin-cert
            - /etc/netcap-firewall/admin-tls/tls.crt
            - --admin-key
            - /etc/netcap-firewall/admin-tls/tls.key
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            {{- if .Values.adminTokenSecret.name }}
            - name: NETCAP_FIREWALL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminTokenSecret.name | quote }}
                  key: {{ .Values.adminTokenSecret.key | quote }}
            {{- end }}
            {{- if eq .Values.mode "fleet" }}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            {{- end }}
          {{- if or .Values.sharedRate.credentialsSecretName .Values.policyState.credentialsSecretName (eq .Values.mode "fleet") }}
          envFrom:
            {{- if .Values.sharedRate.credentialsSecretName }}
            - secretRef: {name: {{ .Values.sharedRate.credentialsSecretName | quote }}}
            {{- end }}
            {{- if .Values.policyState.credentialsSecretName }}
            - secretRef: {name: {{ .Values.policyState.credentialsSecretName | quote }}}
            {{- end }}
            {{- if eq .Values.mode "fleet" }}
            - secretRef: {name: {{ .Values.fleet.credentialsSecretName | quote }}}
            {{- end }}
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
            {{- if .Values.http3.enabled }}
            - {name: http3, containerPort: {{ .Values.http3.port }}, protocol: UDP}
            {{- end }}
          startupProbe:
            httpGet: {path: /readyz, port: admin, scheme: {{ include "firewall.probeScheme" . }}}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: admin, scheme: {{ include "firewall.probeScheme" . }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: admin, scheme: {{ include "firewall.probeScheme" . }}}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/netcap-firewall, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.tls.clientCASecretName }}
            - {name: client-ca, mountPath: /etc/netcap-firewall/client-ca, readOnly: true}
            {{- end }}
            {{- if .Values.upstreamTLS.clientSecretName }}
            - {name: upstream-client, mountPath: /etc/netcap-firewall/upstream-client, readOnly: true}
            {{- end }}
            {{- range $index, $route := .Values.routes }}
            {{- with .upstreamTLS }}
            {{- if .caSecretName }}
            - {name: route-ca-{{ $index }}, mountPath: /etc/netcap-firewall/route-tls/{{ $index }}/ca, readOnly: true}
            {{- end }}
            {{- if .clientSecretName }}
            - {name: route-client-{{ $index }}, mountPath: /etc/netcap-firewall/route-tls/{{ $index }}/client, readOnly: true}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.sharedRate.configSecretName }}
            - {name: shared-rate, mountPath: /etc/shared-rate, readOnly: true}
            {{- end }}
            {{- if .Values.policyState.configSecretName }}
            - {name: policy-state, mountPath: /etc/policy-state, readOnly: true}
            {{- end }}
            {{- if eq .Values.mode "fleet" }}
            - {name: fleet-config, mountPath: /etc/fleet, readOnly: true}
            - {name: agent-state, mountPath: /var/lib/netcap-firewall}
            {{- end }}
            {{- if eq .Values.mode "managed" }}
            - {name: state, mountPath: /var/lib/netcap-firewall}
            {{- end }}
            {{- if .Values.adminTLS.secretName }}
            - {name: admin-tls, mountPath: /etc/netcap-firewall/admin-tls, readOnly: true}
            {{- end }}
            {{- if .Values.tls.secretName }}
            - {name: tls, mountPath: /etc/netcap-firewall/tls, readOnly: true}
            {{- end }}
            {{- if .Values.upstreamTLS.caSecretName }}
            - {name: upstream-ca, mountPath: /etc/netcap-firewall/upstream, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.tls.clientCASecretName }}
        - name: client-ca
          secret: {secretName: {{ .Values.tls.clientCASecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- if .Values.upstreamTLS.clientSecretName }}
        - name: upstream-client
          secret: {secretName: {{ .Values.upstreamTLS.clientSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- range $index, $route := .Values.routes }}
        {{- with .upstreamTLS }}
        {{- if .caSecretName }}
        - name: route-ca-{{ $index }}
          secret: {secretName: {{ .caSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- if .clientSecretName }}
        - name: route-client-{{ $index }}
          secret: {secretName: {{ .clientSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "firewall.configName" . }}
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.spool.size }}}
        {{- if .Values.sharedRate.configSecretName }}
        - name: shared-rate
          secret: {secretName: {{ .Values.sharedRate.configSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- if .Values.policyState.configSecretName }}
        - name: policy-state
          secret: {secretName: {{ .Values.policyState.configSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- if eq .Values.mode "fleet" }}
        - name: fleet-config
          secret: {secretName: {{ .Values.fleet.configSecretName | quote }}, defaultMode: 0440}
        {{- end }}
        {{- if eq .Values.mode "managed" }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "firewall.name" .)) .Values.managed.existingClaim | quote }}
        {{- end }}
        {{- if .Values.adminTLS.secretName }}
        - name: admin-tls
          secret:
            secretName: {{ .Values.adminTLS.secretName | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.upstreamTLS.caSecretName }}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.upstreamTLS.caSecretName | quote }}
            defaultMode: 0440
        {{- end }}
  {{- if eq .Values.mode "fleet" }}
  volumeClaimTemplates:
    - metadata:
        name: agent-state
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.fleet.storageClassName }}
        storageClassName: {{ .Values.fleet.storageClassName | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.fleet.size }}}
  {{- end }}
