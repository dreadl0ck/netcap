# macOS/Windows goreleaser configuration
# For Linux builds, use .goreleaser-linux.yml on a Linux system
# Cross-compiling for Linux from macOS with CGO dependencies is not supported
#
# macOS builds include:
#   - netcap: DPI-enabled (darwin/arm64 only)
#   - netcap_macOS_nodpi: No-DPI version (darwin/arm64)
# Windows builds include:
#   - netcap_nodpi: No-DPI version (windows/amd64)

builds:
  - main: ./cmd
    binary: net
    env:
      - CGO_ENABLED=1
    id: netcap
    goos:
      - darwin
    ldflags:
      - ""
    goarch:
      - arm64
  - main: ./cmd
    binary: macOS_nodpi/net
    id: netcap_macOS_nodpi
    env:
      - CGO_ENABLED=1 # needed to compile gopacket for arm64
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - ""
    flags:
      - -tags=nodpi
  - main: ./cmd
    id: netcap_nodpi
    binary: net
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    ldflags:
      - ""
    flags:
      - -tags=nodpi
    goarch:
      - amd64

archives:
  - id: "netcap"
    builds: [ 'netcap' ]
    files:
      - LICENSE
      - README.md
      - types/cpp/*
      - types/csharp/*
      - types/java/*
      - types/js/*
      - types/python/*
      - types/rust/*
      - types/swift/*
      - types/netcap.pb.go
  - id: "netcap_macOS_nodpi"
    builds: [ 'netcap_macOS_nodpi' ]
    name_template: '{{ .ProjectName }}_nodpi_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - types/cpp/*
      - types/csharp/*
      - types/java/*
      - types/js/*
      - types/python/*
      - types/rust/*
      - types/swift/*
      - types/netcap.pb.go
  - id: "netcap_nodpi"
    builds: [ 'netcap_nodpi' ]
    name_template: '{{ .ProjectName }}_nodpi_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - types/cpp/*
      - types/csharp/*
      - types/java/*
      - types/js/*
      - types/python/*
      - types/rust/*
      - types/swift/*
      - types/netcap.pb.go

