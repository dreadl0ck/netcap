# Harvesters Configuration - EXAMPLE/REFERENCE ONLY
# 
# This file is provided as a reference to show the default configuration.
# YOU DO NOT NEED THIS FILE to use Netcap - all these defaults are built into the code.
#
# Only create a custom configuration file when you want to:
# - Disable specific harvesters
# - Change port mappings
# - Customize parameters (like HTTP sensitive param names)
# - Add custom regex-based harvesters
#
# Usage: net capture -r input.pcap --harvesters-config custom-config.yml

# Harvesters Configuration
# This file controls which credential harvesters are enabled and their parameters

harvesters:
  - name: "HTTP"
    enabled: true
    ports: [80, 8080, 3000, 9090, 8888]
    parameters:
      sensitive_params: 
        - "key"
        - "token"
        - "api_key"
        - "apikey"
        - "secret"
        - "password"
        - "pwd"
        - "pass"
        - "auth"
        - "access_token"
        - "refresh_token"
      sensitive_headers:
        - "Authorization"
        - "X-API-Key"
        - "X-Auth-Token"
        - "X-Access-Token"
      session_cookie_names:
        - "PHPSESSID"
        - "phpsessid"
        - "JSESSIONID"
        - "jsessionid"
        - "ASP.NET_SessionId"
        - "ASPSESSIONId"
        - "sessionid"
        - "session"
        - "_session_id"
        - "connect.sid"
        - "express.sid"
        - "sid"
        - "SESSION"
        - "SESSIONID"
        - "sess"
        - "SESS"
        - "auth_token"
        - "authtoken"
        - "auth"
        - "token"
        - "access_token"
      min_cookie_length: 8
      # HTTP Form Login credential harvesting (POST form data)
      form_username_fields:
        - "log"
        - "login"
        - "wpname"
        - "ahd_username"
        - "unickname"
        - "nickname"
        - "user"
        - "user_name"
        - "alias"
        - "pseudo"
        - "email"
        - "username"
        - "_username"
        - "userid"
        - "form_loginname"
        - "loginname"
        - "login_id"
        - "loginid"
        - "session_key"
        - "sessionkey"
        - "pop_login"
        - "user_id"
        - "screename"
        - "uname"
        - "ulogin"
        - "acctname"
        - "account"
        - "member"
        - "mailaddress"
        - "membername"
        - "login_username"
        - "login_email"
        - "loginusername"
        - "loginemail"
        - "sign-in"
        - "j_username"
        - "identity"
        - "usr"
        - "mail"
      form_password_fields:
        - "ahd_password"
        - "pass"
        - "password"
        - "_password"
        - "passwd"
        - "session_password"
        - "sessionpassword"
        - "login_password"
        - "loginpassword"
        - "form_pw"
        - "userpassword"
        - "upassword"
        - "passwort"
        - "passwrd"
        - "wppassword"
        - "upasswd"
        - "j_password"
        - "pwd"
        - "secret"
        - "credentials"
        - "credential"
        - "pw"
  
  - name: "FTP"
    enabled: true
    ports: [21]
    parameters: {}
  
  - name: "SMTP"
    enabled: true
    ports: [25, 465, 587]
    parameters: {}
  
  - name: "Telnet"
    enabled: true
    ports: [23]
    parameters:
      login_patterns: ["login:", "username:", "Username:", "login as:", "Login:"]
      password_patterns: ["Password:", "password:", "Pass:", "passwd:"]
  
  - name: "IMAP"
    enabled: true
    ports: [143]
    parameters: {}
  
  - name: "NTLMSSP"
    enabled: true
    ports: [445]
    parameters: {}
  
  - name: "Kerberos AS-REQ"
    enabled: true
    ports: [88]
    parameters: {}
  
  - name: "Kerberos AS-REP"
    enabled: true
    ports: [88]
    parameters: {}
  
  - name: "Kerberos TGS-REP"
    enabled: true
    ports: [88]
    parameters: {}
  
  - name: "HTTP NTLM"
    enabled: true
    ports: [80, 8080, 3000, 9090, 8888]
    parameters: {}
  
  - name: "POP3"
    enabled: true
    ports: [110, 995]
    parameters: {}
  
  - name: "Redis"
    enabled: true
    ports: [6379]
    parameters: {}
  
  - name: "SNMP"
    enabled: true
    ports: [161, 162]
    parameters:
      min_community_length: 1
      max_community_length: 255
  
  - name: "LDAP"
    enabled: true
    ports: [389, 636]
    parameters:
      username_attributes: ["cn", "uid", "mail", "sAMAccountName"]
      extract_simple_username: true
  
  - name: "PostgreSQL"
    enabled: true
    ports: [5432]
    parameters: {}
  
  - name: "PostgreSQL Hash"
    enabled: true
    ports: [5432]
    parameters: {}
  
  - name: "MySQL"
    enabled: true
    ports: [3306]
    parameters: {}
  
  - name: "VNC"
    enabled: true
    ports: [5900, 5901, 5902, 5903, 5904, 5905, 5906, 5907, 5908, 5909]
    parameters: {}
  
  - name: "MongoDB"
    enabled: true
    ports: [27017]
    parameters: {}
  
  - name: "MongoDB Challenge Response"
    enabled: true
    ports: [27017]
    parameters: {}

  # Network Access Authentication
  - name: "RADIUS"
    enabled: true
    ports: [1812, 1813]
    description: "Remote Authentication Dial-In User Service - network access authentication"
    parameters: {}

  # Proxy Protocols
  - name: "SOCKS"
    enabled: true
    ports: [1080]
    description: "SOCKS Proxy Protocol - proxy authentication credentials"
    parameters: {}

  # VoIP Protocols
  - name: "SIP"
    enabled: true
    ports: [5060, 5061]
    description: "Session Initiation Protocol - VoIP authentication (Digest/Basic)"
    parameters: {}

  # IoT Protocols
  - name: "MQTT"
    enabled: true
    ports: [1883, 8883]
    description: "Message Queuing Telemetry Transport - IoT messaging authentication"
    parameters: {}

  # Remote Desktop Protocols
  - name: "TeamViewer"
    enabled: true
    ports: [5938]
    description: "TeamViewer remote desktop sessions and authentication events"
    parameters: {}

  # Network Discovery Protocols
  - name: "TLS SNI"
    enabled: true
    ports: [443, 8443, 993, 995, 465, 636]
    description: "TLS Server Name Indication - captures encrypted destination hostnames"
    parameters: {}
  
  - name: "mDNS"
    enabled: true
    ports: [5353]
    description: "Multicast DNS - local network service discovery and hostname mapping"
    parameters: {}
  
  - name: "NBNS"
    enabled: true
    ports: [137]
    description: "NetBIOS Name Service - Windows network hostname discovery"
    parameters: {}
  
  - name: "UPnP"
    enabled: true
    ports: [1900]
    description: "Universal Plug and Play - network device and service discovery"
    parameters: {}
  
  - name: "WSD"
    enabled: true
    ports: [3702]
    description: "Web Services Discovery - Windows device discovery protocol"
    parameters: {}

# Custom harvesters allow you to define regex-based credential extraction
custom_harvesters: []
  # Example:
  # - name: "Custom Credit Card"
  #   enabled: false
  #   ports: []
  #   regex: "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b"
  #   parameters: {}

