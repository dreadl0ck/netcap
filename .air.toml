# Air configuration for Netcap service mode development
# https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["capture", "--service", "-http", "localhost:8080", "-service-data-dir", "./data/service-local"]
  bin = "./tmp/main"
  cmd = "go build -tags nodpi -o ./tmp/main github.com/dreadl0ck/netcap/cmd"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "cmd/capture/webui/frontend/node_modules", "cmd/capture/webui/frontend/.next", "cmd/capture/webui/frontend/out", "dist", "dist-linux", "data", "pcaps", "tests", "test-output", "test-params", "FlameGraph"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

